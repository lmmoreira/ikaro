<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Vitta Studio</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <link rel="stylesheet" href="service-detail.css">
</head>
<body>
  <!--
    01d — unavailable state: hotsite unpublished, service inactive/missing, or the service's page unpublished (republishing restores the same URL). Same not-found treatment as other missing public pages; also noindex.
    ROUTE: /{slug}/servicos/{serviceSlug}   (app/[slug]/servicos/[serviceSlug]/page.tsx — NEW, TD56-S03)
    COMPONENT: ServiceDetailPage (apps/web/shells/hotsite/components/ServiceDetailPage.tsx — NEW)
    DATA: manifest (published only) + GET /public/services/by-slug/:publicSlug — profile-facing fields only, never booking configuration.
    LOOK: SERVICE_LIST.data.detailPage (heroStyle, galleryLayout, showPrice, showDuration, showLoyaltyPoints, bookingCtaLabel).
    CTA: /{slug}/booking?serviceId=<id> — no date; the booking flow decides every following step from the live service model.
  -->
  <div class="proto-banner">Protótipo — redimensione para ver mobile (390px) e desktop</div>
  <!--
    CHROME (production): HotsiteAuthBar renders the NAVIGATION links (desktop) / menu (mobile) — the SAME bar as the home page and /booking,
    hrefs are absolute-to-home (/{slug}#service-list …) so they work from this page. NO chatbot widget on this page. Footer only if a FOOTER module is enabled.
  -->
  <div class="auth-bar" style="justify-content: space-between; gap:1rem;">
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <div style="width:1.75rem;height:1.75rem;border-radius:9999px;background:var(--ba-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8125rem;">V</div>
      <span style="font-weight:700;font-size:0.875rem;">Vitta Studio</span>
    </div>
    <nav class="nav-links" aria-label="Navegação do site">
      <a href="../../../shared/hotsite.html#service-list">Serviços</a>
      <a href="../../../shared/hotsite.html#gallery">Galeria</a>
      <a href="../../../shared/hotsite.html#about">Sobre</a>
      <a href="../../../shared/hotsite.html#contact">Contato</a>
    </nav>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <button class="nav-menu-btn" aria-haspopup="true" aria-label="Abrir menu">☰ Menu</button>
      <a href="../../../shared/login.html" style="font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">Entrar</a>
    </div>
  </div>
  <main class="sd-empty">
    <h1>Página não encontrada</h1>
    <p style="opacity:0.7;margin-bottom:1.5rem;">Este serviço não está disponível no momento.</p>
    <a class="btn-primary" href="../../../shared/hotsite.html#service-list" style="text-decoration:none;">Ver todos os serviços</a>
  </main>
  <footer class="sd-footer">Vitta Studio · (11) 99999-0000 · São Paulo, SP</footer>
</body>
</html>
