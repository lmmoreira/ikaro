<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barra de ações mobile — TD57</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <link rel="stylesheet" href="../../../shared/feedback-pane.css">
  <style>
    .f-group { margin-bottom: 1rem; min-width: 0; }
    .f-label { display: block; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(17,24,39,0.55); margin-bottom: 0.375rem; }
    .f-input { width: 100%; box-sizing: border-box; border: 1.5px solid var(--ba-secondary); border-radius: var(--ba-radius); padding: 0.6875rem 0.875rem; font-size: 0.9375rem; font-family: inherit; color: var(--ba-text); background: white; }
    .f-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; }
    @media (max-width: 640px) { .f-grid3 { grid-template-columns: minmax(0, 1fr); } }
    .f-tabs { display: flex; gap: 1.25rem; border-bottom: 1px solid var(--ba-secondary); margin-bottom: 1rem; overflow-x: auto; }
    .f-tab { padding: 0.625rem 0; font-size: 0.9375rem; color: rgba(17,24,39,0.55); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; }
    .f-tab.active { color: var(--ba-text); font-weight: 600; border-bottom-color: #2563eb; }
    .f-h2 { font-size: 1rem; font-weight: 700; color: var(--ba-text); margin: 0 0 0.25rem; }
    .f-intro { font-size: 0.875rem; color: rgba(17,24,39,0.6); margin: 0 0 1rem; }
    .proto-note { background: #fef3c7; border: 1px dashed #d97706; color: #92400e; border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.8125rem; margin: 0 0 1rem; }
    .pill { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.125rem 0.5rem; border-radius: 9999px; }
    .pill-on  { background: #dcfce7; color: #166534; }
    .pill-off { background: #f3f4f6; color: #4b5563; }
    .pill-pend { background: #fef3c7; color: #92400e; }

    .phones { display: flex; gap: 2rem; flex-wrap: wrap; padding: 1rem 1.5rem 3rem; }
    .phone-fig { margin: 0; }
    .phone-fig figcaption { font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--ba-text); }
    .phone { width: 360px; height: 640px; border: 6px solid #111827; border-radius: 28px; position: relative; overflow: hidden; background: #f9fafb; }
    .phone-body { padding: 1rem; display: grid; gap: 0.75rem; }
    .skel { height: 3.5rem; border-radius: 8px; background: white; border: 1px solid var(--ba-secondary); }
    .phone .fb-mobile-bar { position: absolute; }
    .phone .fb-mobile-bar.fb-force { display: flex !important; }

  </style>
</head>
<body>

  <!--
    COMPONENT: ActionPane mobile bar (fixed inset-x-0 bottom-0 lg:hidden) + FeedbackMessage
    FILE:      apps/web/shared/components/ui/action-pane.tsx  (EXISTS — TD57-S01; ServiceEditPanels.tsx / SettingsFormActions.tsx migrate to it in later stories)
    RULE:      message ABOVE the buttons inside the bar; max-height ~6.5rem with overflow scroll so a long message never pushes the bar off screen.
               The page keeps MOBILE_ACTION_BAR_CLEARANCE_CLASS so content is never hidden behind the bar.
    OPEN:      customer screens render their mobile pane in normal flow today (not fixed) — decided in TD57-S11 whether they adopt the fixed bar.
  -->
  <div style="background:#fef3c7;border-bottom:1px solid #d97706;padding:0.375rem 1rem;font-size:0.8125rem;text-align:center;color:#92400e;">
    Protótipo — TD57 — barra fixa mobile (360 px): mensagem curta, mensagem longa com rolagem e sucesso
  </div>
  <div class="phones">
      <figure class="phone-fig">
        <figcaption>Erro curto</figcaption>
        <div class="phone">
          <div class="phone-body"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
          <div class="fb-mobile-bar fb-force">
            <div class="fb fb-error" role="alert" data-testid="form-feedback">
          <span class="fb-title">Não foi possível salvar</span>
          <span>Para duração escolhida pelo cliente, informe mínimo, máximo e incremento.</span>
        </div>
            <div class="fb-buttons"><a class="btn-secondary" href="01-servico-politicas.html">Cancelar</a><button type="button" class="btn-primary">Salvar</button></div>
          </div>
        </div>
      </figure>
      <figure class="phone-fig">
        <figcaption>Erro longo (rola dentro da barra)</figcaption>
        <div class="phone">
          <div class="phone-body"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
          <div class="fb-mobile-bar fb-force">
            <div class="fb fb-error" role="alert" data-testid="form-feedback">
          <span class="fb-title">Não foi possível salvar</span>
          <span>Para duração escolhida pelo cliente, informe mínimo, máximo e incremento. O preço por hora exige incremento de 15 ou 30 minutos, e a janela de agendamento precisa ser maior que a antecedência mínima configurada para este serviço. Revise também o limite máximo de reservas por dia, que não pode ser menor que a capacidade do recurso.</span>
          <span class="fb-hint">Corrija os campos marcados e salve novamente.</span>
        </div>
            <div class="fb-buttons"><a class="btn-secondary" href="01-servico-politicas.html">Cancelar</a><button type="button" class="btn-primary">Salvar</button></div>
          </div>
        </div>
      </figure>
      <figure class="phone-fig">
        <figcaption>Sucesso</figcaption>
        <div class="phone">
          <div class="phone-body"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
          <div class="fb-mobile-bar fb-force">
            <div class="fb fb-success" role="status" data-testid="form-feedback">
          <span class="fb-title">Alterações salvas</span>
          <span>As políticas do serviço foram atualizadas.</span>
        </div>
            <div class="fb-buttons"><a class="btn-secondary" href="01-servico-politicas.html">Cancelar</a><button type="button" class="btn-primary">Salvar</button></div>
          </div>
        </div>
      </figure>
  </div>
</body>
</html>
