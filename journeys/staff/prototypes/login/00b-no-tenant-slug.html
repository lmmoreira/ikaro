<!DOCTYPE html>

  <!--
    COMPONENT: StaffLoginPage (no-tenantSlug branch)
    FILE:      apps/web/app/dashboard/login/page.tsx  (EXISTS)
    ROUTE:     /dashboard/login  (no ?tenantSlug= query param)

    This is a real, shipped early-return branch of the same page as
    00-staff-login.html (shared/staff-login.html) — not a separate route.
    When tenantSlug is absent, the page renders only the logo + heading +
    this message. No Google Sign-In button is shown at all, because
    buildGoogleOAuthUrl() requires tenantSlug to construct the OAuth URL.

    When this happens in practice: staff bookmarking a bare /dashboard/login
    URL, or a stale link with no tenantSlug. Copy source: t('staffLoginViaHotsite').
  -->

        background: #4f46e5; border-radius: 0.75rem;
        margin: 0 auto 1.5rem;
        display: flex; align-items: center; justify-content: center;
      ">
        <span style="color: white; font-weight: 700; font-size: 1.25rem;">I</span>
      </div>

      <h1 style="font-size: 1.5rem; font-weight: 700; color: #111827;">
        Área da Equipe

      <p style="font-size: 0.875rem; color: #6b7280; margin-top: 1rem;">
