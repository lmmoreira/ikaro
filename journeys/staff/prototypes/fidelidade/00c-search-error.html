  <!--
    COMPONENT: LoyaltySearchPage — fetch-error state
    FILE:      apps/web/features/loyalty/components/dashboard/LoyaltySearchPage.tsx  (EXISTS)
    Added 2026-07-31 — real state had no prototype screen. Shown when searchCustomers()
    rejects; errorMessage comes from resolveErrorMessageFromApiError(err, locale).
    TD57-S15: the failure is a page-level FeedbackMessage (role="alert") with a retry that
    re-runs the debounced search, inside the list card — no longer the empty state with
    an icon. Title = t('searchErrorTitle'); body = the backend-resolved message (the generic
    "Algo deu errado. Tente novamente." when the response carries no code); retry label =
    booking.errors.tryAgain. The search input sits in its own card (every control in a card).
  -->

      <div class="sidebar-header">
        <div class="sidebar-logo">B</div>

        <div class="card" style="padding:1.25rem;">

        </div>

      </div>
