<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do hotsite — erro ao entrar</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <link rel="stylesheet" href="../../../shared/feedback-pane.css">
</head>
<body>
  <!--
    TD57-S16 — hotsite sign-in failure.

    PAGE (built): apps/web/app/[slug]/login/page.tsx (Server Component)
    ROUTE:        /{slug}/login?error=<reason>
    STATE:        the OAuth callback redirected back with ?error=. The page shows the branded
                  error under the Google button and keeps the button, so the visitor retries
                  from the same screen. role="alert", the Story 6 branded component, fixed
                  semantic palette; only --ba-radius / --ba-body-font / --ba-heading-font are read.
    COPY:         web.json hotsite login.signInError ("Erro ao entrar. Tente novamente.")
    TEST ID:      none today; the E2E scenario (hotsite-login.spec.ts) locates it by role=alert
  -->
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ba-background);">
    <div class="card" style="width: 100%; max-width: 24rem; padding: 2rem; text-align: center;">

      <div style="width: 3rem; height: 3rem; background: var(--ba-primary); border-radius: var(--ba-radius); margin: 0 auto 1.25rem; display: flex; align-items: center; justify-content: center;">
        <span style="color: white; font-weight: 700; font-size: 1.25rem;">B</span>
      </div>

      <h1 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.375rem; color: var(--ba-text)">Entrar na BeloAuto</h1>
      <p style="font-size: 0.875rem; opacity: 0.65; margin-bottom: 1.75rem; color: var(--ba-text)">Entre com sua conta Google para agendar</p>

      <a href="../../../shared/login.html" data-testid="google-login" style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; border: 1px solid var(--ba-secondary); border-radius: var(--ba-radius); padding: 0.75rem 1.5rem; text-decoration: none; color: var(--ba-text); font-weight: 500; box-shadow: var(--ba-shadow); width: 100%;">
        Entrar com Google
      </a>

      <div class="fb-ba fb-ba-error" role="alert" style="margin-top: 1rem; text-align: left;">Erro ao entrar. Tente novamente.</div>

      <p style="margin-top: 1.5rem; font-size: 0.75rem; opacity: 0.45; color: var(--ba-text);">Ao entrar, você concorda com os termos de uso.</p>
    </div>
  </div>
</body>
</html>
