<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus avisos — erro — Vitta Studio</title>
  <link rel="stylesheet" href="../../../shared/customer-shell.css">
  <link rel="stylesheet" href="../../../shared/feedback-pane.css">
  <style>
    details summary { list-style: none; }
    details summary::-webkit-details-marker { display: none; }


    .section-label {
      font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: rgba(17,24,39,0.4); margin: 0 0 0.625rem;
    }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .page-title { font-size: 1.125rem; font-weight: 700; color: var(--ik-text); margin: 0; }

    .rec-card {
      background: white; border: 1px solid var(--ik-soft);
      border-radius: var(--ik-radius); margin-bottom: 0.75rem;
      box-shadow: var(--ik-shadow); overflow: hidden;
      text-decoration: none; display: block; color: var(--ik-text);
    }
    .rec-card-header { display: flex; align-items: flex-start; gap: 0.875rem; padding: 1rem 1rem 0.75rem; }
    .rec-accent { width: 0.25rem; border-radius: 4px; flex-shrink: 0; align-self: stretch; }
    .rec-body { flex: 1; min-width: 0; }
    .rec-name { font-weight: 700; font-size: 0.9375rem; color: var(--ik-text); }
    .rec-meta { font-size: 0.8125rem; opacity: 0.55; color: var(--ik-text); margin-top: 0.1875rem; }
    .rec-footer {
      border-top: 1px solid var(--ik-soft); padding: 0.625rem 1rem;
      display: flex; align-items: center; justify-content: space-between; background: #fafafa;
    }
    .rec-footer-label { font-size: 0.8125rem; color: var(--ik-text); font-weight: 500; }
    .rec-footer-value { font-size: 0.8125rem; color: var(--ik-primary); font-weight: 600; }

    .badge { display: inline-flex; align-items: center; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.03em; padding: 0.1875rem 0.5rem; border-radius: 4px; margin-left: 0.5rem; }
    .badge-ativa   { background: #f0fdf4; color: #15803d; }
    .badge-analise { background: #fef3c7; color: #92400e; }
    .badge-pausada { background: #f1f5f9; color: #475569; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--ik-text); }
    .empty-state p { font-size: 0.9375rem; margin: 0.5rem 0 1.25rem; opacity: 0.55; }

    .field { margin-bottom: 1.125rem; }
    .field-hint { font-size: 0.8125rem; opacity: 0.6; margin-top: 0.25rem; }
    .field-error { font-size: 0.8125rem; color: #dc2626; margin-top: 0.25rem; }
    .form-input.invalid { border-color: #dc2626; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.4375rem 0.75rem; border: 1px solid var(--ik-soft); border-radius: 999px; font-size: 0.875rem; background: white; cursor: pointer; }
    .chip.on { border-color: var(--ik-primary); background: #eff6ff; }
    .choice { display: flex; align-items: center; gap: 0.625rem; padding: 0.75rem 0.875rem; border: 1px solid var(--ik-soft); border-radius: var(--ik-radius); background: white; margin-bottom: 0.5rem; cursor: pointer; }
    .choice.on { border-color: var(--ik-primary); background: #eff6ff; }
    .readonly-value { padding: 0.625rem 0.75rem; border: 1px dashed var(--ik-soft); border-radius: var(--ik-radius); background: #fafafa; font-size: 0.875rem; }

    .row { padding: 1rem 0; border-bottom: 1px solid var(--ik-soft); }
    .row:last-child { border: 0; }
    .meta { font-size: 0.8125rem; opacity: 0.7; margin-top: 0.25rem; }
    .notice { background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--ik-radius); padding: 1rem; margin-top: 1rem; }
    .notice-error { background: #fef2f2; border-color: #fca5a5; }
    .notice-ok { background: #f0fdf4; border-color: #86efac; }
    .panel { display: none; margin-top: 1rem; }
    .panel:target { display: block; }
    .summary-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.625rem 0; border-bottom: 1px solid var(--ik-soft); font-size: 0.875rem; }
    .summary-row:last-child { border: 0; }
    .summary-row span:first-child { opacity: 0.6; }
    .proto-only { margin-top: 1.5rem; padding: 0.875rem; border: 1px dashed #9ca3af; border-radius: var(--ik-radius); font-size: 0.8125rem; color: #4b5563; }
    .proto-only a { margin-right: 0.75rem; }
    .tag-proposal { display: inline-block; font-size: 0.6875rem; font-weight: 700; background: #ede9fe; color: #5b21b6; padding: 0.1875rem 0.5rem; border-radius: 4px; margin-bottom: 0.75rem; }
    .step-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.5; margin-bottom: 0.25rem; }

    .skeleton { background: linear-gradient(90deg,#f1f5f9,#e2e8f0,#f1f5f9); border-radius: 6px; }
    .btn-link { background: none; border: 0; padding: 0; font: inherit; color: var(--ik-primary); font-weight: 600; cursor: pointer; text-decoration: none; margin-right: 1rem; }
    @media (min-width: 1024px) {
      .topbar-brand { display: flex !important; }
      .desktop-only { display: inline-flex !important; }
      .mobile-only  { display: none !important; }
      .topbar-user-name { display: inline !important; }
    }
  </style>
</head>
<body>

  <!--
    VARIANT OF: 07-availability-alert.html
    SCENARIO:   GET /availability-alerts rejected (network / 5xx) — an alert with a retry action.
    COMPONENT: AvailabilityAlertList  (GAP — M23-S12)
    PAGE:       apps/web/app/[slug]/my-account/alerts/page.tsx  (GAP — M23-S12) — account shell (Tailwind + shadcn in the real app)
    BFF:        GET /availability-alerts  (customer only; at most the 100 most recent, history included)
  -->

  <!-- TOP BAR — drill-down pattern: back link replaces the brand slot (CustomerTopbar backHrefOverride), no tab nav / bottom nav -->
  <div class="dashboard-topbar">
    <a href="01-minha-conta.html" style="display:flex;align-items:center;gap:0.375rem;text-decoration:none;color:var(--ik-text);font-size:0.9375rem;font-weight:600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Agendamentos
    </a>
    <div style="margin-left:auto;display:flex;align-items:center;gap:0.75rem;">
      
      <div class="list-avatar" style="width:2rem;height:2rem;font-size:0.8125rem;">MF</div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="dashboard-layout">
    <main class="main-content">
      <div class="dashboard-body">
        <div class="page-head"><h1 class="page-title">Meus avisos</h1></div>
        <div class="fb fb-error" role="alert" data-testid="alerts-load-error" style="margin-top:1rem;"><span class="fb-title">Não foi possível carregar seus avisos.</span><span class="fb-hint">Verifique sua conexão e tente de novo.</span><a class="fb-retry" href="07-availability-alert.html" data-testid="alerts-retry" style="text-decoration:none;">Tentar novamente</a></div>

      </div>
    </main>
  </div>

</body>
</html>
