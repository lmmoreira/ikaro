<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 2 — Calendário e horário</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
</head>
<body>
  <!--
    COMPONENTS:
      AvailabilityCarousel  apps/web/features/booking/components/public/AvailabilityCarousel.tsx  (EXISTS)
      SlotPicker            apps/web/features/booking/components/public/SlotPicker.tsx             (EXISTS)

    BFF CALLS:
      Carousel → GET /schedule/availability/summary?from=YYYY-MM-DD&to=YYYY-MM-DD&serviceIds=uuid,uuid
                 Header: X-Tenant-Slug: {slug}
                 Fetcher: apps/web/lib/api/schedule.ts
                 Response: AvailabilitySummaryResponse { dates: { date: string; available: boolean }[] }

      Slots    → GET /schedule/availability?date=YYYY-MM-DD&serviceIds=uuid,uuid
                 Header: X-Tenant-Slug: {slug}
                 Response: AvailabilityResponse { slots: { startsAt: string; endsAt: string }[] }

    M23 (S11a/S11b) — THIS is the single availability step for EVERY flow (simple service, chosen/auto resources, bundle, legged journey,
      variable duration); there is no separate "11" screen and no UI change: same day-pill carousel + slot buttons. The query changes, the
      interaction does not:
        GET /schedule/availability(/summary)?...&resourceSelections=<serviceId>:<legIndex|->:<type>:<resourceId>,...&durationMinutes=N  (M23-S29)
        - the customer's picks (steps 05-05h) are pinned and the engine still intersects the rest of the service (bundle room, every leg, quantity)
        - AUTO_ANY / pool: no selection, the engine derives the resources
        - CUSTOMER_SELECTED duration (step 12): durationMinutes
      Both params are OPTIONAL props on AvailabilityStep/AvailabilityCarousel/AvailabilityCalendar/SlotPicker and part of their effect
      dependencies, so a changed pick or duration re-fetches (loading 02b, error 02c, empty 02d, day error 02f); the dashboard
      RescheduleBookingPage, which renders the same components, is unchanged. Errors returning here: 02e (slot), 09b (bundle), 10b (leg).
      The indicator is computed; this file shows the default path ("Passo 2 de 4").
    STATE (in BookingForm parent):
      selectedDate: string | null
      selectedSlot: AvailableSlot | null
      step2Error:   string | null  — set to 'Horário indisponível, escolha outro' on 409 from submit
  -->
  <!-- BRAND + AUTH BAR -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);
              padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);
                  color:white;display:flex;align-items:center;justify-content:center;
                  font-weight:700;font-size:0.8125rem;">B</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">BeloAuto Demo</span>
    </div>
    <a href="../../../shared/login.html" style="display:flex;align-items:center;gap:0.375rem;
       font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Entrar
    </a>
  </div>

  <div class="step-container">
    <p class="step-indicator">Passo 2 de 4</p>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: var(--ba-text)">Escolha data e horário</h2>

    <!--
      LOADING STATE — AvailabilityCarousel while fetchAvailabilitySummary() is pending (days === null)
      Replaces the entire carousel below.
      Uncomment to preview:
    -->
    <!--
    <p style="opacity: 0.75; font-size: 0.875rem;">Carregando disponibilidade...</p>
    -->

    <!--
      FETCH ERROR STATE — AvailabilityCarousel when fetchAvailabilitySummary() rejects (error === true)
      Replaces the entire carousel below. No retry button today — only a static message.
      Uncomment to preview:
    -->
    <!--
    <p style="font-size: 0.875rem; color: #dc2626;">Não foi possível carregar a disponibilidade. Tente novamente.</p>
    -->

    <!-- AVAILABILITY CAROUSEL — horizontal scroll of day pills -->
    <!-- Loaded: each day-pill is disabled when day.available === false (see Known limitations in dev-notes.md re: all-unavailable case) -->
    <div style="display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem;">
      <div class="day-pill unavailable">
        <p style="font-size: 0.7rem; font-weight: 600;">SEG</p>
        <p style="font-weight: 700; font-size: 0.9375rem;">16</p>
      </div>
      <div class="day-pill available">
        <p style="font-size: 0.7rem; font-weight: 600;">TER</p>
        <p style="font-weight: 700; font-size: 0.9375rem;">17</p>
      </div>
      <!-- Selected day -->
      <div class="day-pill selected">
        <p style="font-size: 0.7rem; font-weight: 600;">QUA</p>
        <p style="font-weight: 700; font-size: 0.9375rem;">18</p>
      </div>
      <div class="day-pill available">
        <p style="font-size: 0.7rem; font-weight: 600;">QUI</p>
        <p style="font-weight: 700; font-size: 0.9375rem;">19</p>
      </div>
      <div class="day-pill unavailable">
        <p style="font-size: 0.7rem; font-weight: 600;">SEX</p>
        <p style="font-weight: 700; font-size: 0.9375rem;">20</p>
      </div>
      <div class="day-pill unavailable">
        <p style="font-size: 0.7rem; font-weight: 600;">SÁB</p>
        <p style="font-weight: 700; font-size: 0.9375rem;">21</p>
      </div>
      <div class="day-pill unavailable">
        <p style="font-size: 0.7rem; font-weight: 600;">DOM</p>
        <p style="font-weight: 700; font-size: 0.9375rem;">22</p>
      </div>
    </div>

    <!--
      SLOT PICKER — shown when selectedDate is set
      Loading: "Carregando horários..." while fetching
    -->
    <div style="margin-top: 1.5rem;">
      <p style="font-size: 0.875rem; opacity: 0.75; margin-bottom: 0.75rem;">
        Horários disponíveis — Qua, 18 de junho
      </p>
      <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
        <button class="slot-btn">08:00</button>
        <button class="slot-btn">09:00</button>
        <!-- Selected slot -->
        <button class="slot-btn selected">10:00</button>
        <button class="slot-btn">11:00</button>
        <button class="slot-btn">14:00</button>
        <button class="slot-btn">15:00</button>
        <button class="slot-btn">16:00</button>
      </div>
    </div>

    <!--
      ERROR STATE — shown when 409 Conflict on submit (slot was taken between selection and submit)
      data-testid="step2-error"
      Uncomment to preview:
    -->
    <!--
    <p style="margin-top: 1rem; font-size: 0.875rem; color: #dc2626;" data-testid="step2-error">
      Horário indisponível, escolha outro
    </p>
    -->

    <div class="nav-buttons" style="flex-wrap:wrap;">
      <a class="btn-secondary" href="01-service-selection.html">Voltar</a>
      <!--
        ALERT ENTRY — M23-S31 (GAP: not built yet). Guest: the button goes to the login prompt (17-login-aviso.html); after login/account creation the customer lands on the alert page (customer/prototypes/book-a-service/16-novo-aviso.html). An already-authenticated customer goes straight there (see customer/prototypes/book-a-service/02-calendar-slot.html).
        One button in the nav row, between Voltar and Próximo — no explanatory text. Shown for every alert-eligible
        service (bookingPolicy.availabilityAlertEligible), with or without slots; NOT shown on the loading (02b),
        fetch-error (02c / 02f) or slot-conflict (02e) states.
        Link: /{slug}/booking/availability-alert?serviceId=…&preferredResourceId=…&durationMinutes=…&participantCount=…
      -->
      <a class="btn-secondary" data-testid="availability-alert-entry" href="17-login-aviso.html" style="color:var(--ba-primary);border-color:var(--ba-primary);">Avise-me quando abrir</a>
      <!-- Disabled state: btn-primary:disabled when selectedSlot === null -->
      <a class="btn-primary" href="03-personal-info.html">Próximo</a>
    </div>
  </div>
</body>
</html>
