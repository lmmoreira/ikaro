<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 2 — Opção não disponível</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    .staff-card { display:flex; align-items:center; gap:0.875rem; padding:0.875rem; cursor:pointer; }
    .staff-avatar { width:3rem; height:3rem; border-radius:9999px; flex-shrink:0; background:var(--ba-primary); color:white;
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; }
    .staff-name { font-weight:600; color:var(--ba-text); }
    .section-title { font-size:0.875rem; font-weight:700; color:var(--ba-text); margin:1.25rem 0 0.5rem; }
    .section-title small { font-weight:500; opacity:0.65; }
    .hint { font-size:0.8125rem; opacity:0.7; }
    .alert-err { display:flex; align-items:flex-start; gap:0.625rem; background:#fef2f2; border:1.5px solid #fca5a5;
      border-radius:var(--ba-radius); padding:0.75rem 1rem; margin:1rem 0; color:#991b1b; }
    .alert-err p { margin:0; }
    .alert-err .t { font-weight:700; }
    .alert-err .d { font-size:0.8125rem; margin-top:0.25rem; }
    .skeleton { background:linear-gradient(90deg,#e5e7eb,#f3f4f6,#e5e7eb); border-radius:var(--ba-radius); height:4.25rem; margin-bottom:0.75rem; }
    .leg-timeline { position:relative; padding-left:1.75rem; }
    .leg-item { position:relative; padding-bottom:1.5rem; }
    .leg-item:last-child { padding-bottom:0; }
    .leg-dot { position:absolute; left:-1.75rem; top:0.125rem; width:0.75rem; height:0.75rem; border-radius:9999px;
      background:var(--ba-primary); border:2px solid white; box-shadow:0 0 0 1px var(--ba-secondary); }
    .leg-line { position:absolute; left:-1.4375rem; top:0.875rem; bottom:-0.625rem; width:2px; background:var(--ba-secondary); }
    .leg-item:last-child .leg-line { display:none; }
    .leg-time { font-weight:700; color:var(--ba-text); font-size:0.9375rem; }
    .leg-name { font-weight:600; color:var(--ba-primary); font-size:0.9375rem; margin-top:0.125rem; }
    .leg-resource { font-size:0.8125rem; opacity:0.6; margin-top:0.125rem; }
    .transition-note { font-size:0.75rem; opacity:0.5; margin-top:0.375rem; font-style:italic; }
    .row { display:flex; justify-content:space-between; font-size:0.875rem; color:var(--ba-text); padding:0.25rem 0; }
    .btn-disabled { opacity:0.5; cursor:not-allowed; pointer-events:none; }
    .rate { font-size:0.8125rem; opacity:0.75; }
  </style>
</head>
<body>
  <!--
    COMPONENT: ResourcePicker  apps/web/features/booking/components/public/ResourcePicker.tsx  (NEW, M23-S11a)
    ONE screen for EVERY resource type and EVERY service type (staff, room, equipment; flat service, bundle, legged
    journey). It is built from GET /public/services/:id/resource-options -> requirements[]; each requirement whose
    selectionMode is CUSTOMER_CHOICE becomes one section (heading = resource type label, plus the leg name for a legged
    service). AUTO_ANY / AUTO_FUNGIBLE_POOL / NONE requirements never produce a section.
    NO SCREEN WHEN: the options response has no CUSTOMER_CHOICE requirement (auto staff, fungible pool, an automatic
    room, ...). The step engine (resolveBookingSteps) omits the step entirely: Serviços -> next step, no note, no
    "automatic" screen. The assigned name only appears AFTER booking (04h); a pool never shows a unit name.
    BFF CALL:  GET /public/services/:id/resource-options (M23-S29)  ->  requirements[{ serviceId, legIndex, resourceType,
               selectionMode:'CUSTOMER_CHOICE', requiredQuantity, options:[{ resourceId, name }] }]  — NAME ONLY.
    OUTPUT:    the picks go to availability (resourceSelections param) and to POST /bookings (resourceSelections[]).
    INDICATOR: computed. This screen shows the path "chosen staff + intake" = "Passo 2 de 6".
    STATE: POST /bookings returned 422 BOOKING_RESOURCE_SELECTION_REQUIRED or BOOKING_SERVICE_RESOURCE_TYPE_UNAVAILABLE.
    The form returns to this step, options are RE-FETCHED, the invalid pick is cleared, other selections are kept.
    COPY: the catalogue text of the wire code — BOOKING_RESOURCE_SELECTION_REQUIRED: "É necessário escolher um recurso para este serviço." (BOOKING_SERVICE_RESOURCE_TYPE_UNAVAILABLE has its own text, same screen).
  -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8125rem;">V</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">Vitta Studio</span>
    </div>
    <a href="../../../shared/login.html" style="font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">Entrar</a>
  </div>
  <div class="step-container">
    <p class="step-indicator">Passo 2 de 6</p>
    <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:0.375rem;color:var(--ba-text)">Escolha o profissional</h2>
    <p style="font-size:0.875rem;opacity:0.7;margin-bottom:1.25rem;">Corte + Escova — R$ 90,00 — 50 min</p>
    <div class="alert-err" role="alert" data-testid="resource-picker-submit-error"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div><p class="t">É necessário escolher um recurso para este serviço.</p><p class="d">Escolha novamente. Seus serviços e as demais escolhas foram mantidos.</p></div></div>
    <ul style="display:flex;flex-direction:column;gap:0.75rem;list-style:none;padding:0;">
      <li><label class="card staff-card"><input type="radio" name="p" style="width:1.125rem;height:1.125rem;"><div class="staff-avatar">CD</div><div style="flex:1;"><p class="staff-name">Camila Duarte</p></div></label></li>
      <li><label class="card staff-card"><input type="radio" name="p" style="width:1.125rem;height:1.125rem;"><div class="staff-avatar" style="background:#7c3aed;">BA</div><div style="flex:1;"><p class="staff-name">Bruno Alves</p></div></label></li>
    </ul>
    <div class="nav-buttons"><a class="btn-secondary" href="01-service-selection.html">Voltar</a><button class="btn-primary btn-disabled" disabled aria-disabled="true">Próximo</button></div>
  </div>
</body>
</html>
