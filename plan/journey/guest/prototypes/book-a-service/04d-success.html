<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 4 — Solicitação enviada</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
</head>
<body>
  <!--
    VARIANT OF: 04-confirmation.html
    SCENARIO:   POST /bookings returned 201 Created. status = 'success' — the entire
                step content is replaced with this view. Terminal state — no nav-buttons.
    COMPONENTS: ConfirmationStep (EXISTS) + BookingSubmittedDetails (NEW, M23-S11a)
                apps/web/features/booking/components/public/ConfirmationStep.tsx
                apps/web/features/booking/components/public/BookingSubmittedDetails.tsx
    SUCCESS:    "Solicitação enviada! Aguarde a confirmação por email."  (data-testid="booking-success", unchanged)
    DETAILS BOX (M23-S11a): a subtle box between the message and "Voltar para o site", for EVERY booking.
                Data = the booking response the submission hook keeps: lines (name, price, duration), scheduledAt
                (formatted in the TENANT timezone with useFormatting), totalPrice, totalDurationMins.
                Resource lines render only when applicable (see 04f). No hold deadline, countdown or alert button —
                every one-off booking is created PENDING and the message already says so.
                Styling: business branding (--ba-* tokens), same look as BookingSummaryCard.
  -->
  <!-- BRAND + AUTH BAR -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);
              padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);
                  color:white;display:flex;align-items:center;justify-content:center;
                  font-weight:700;font-size:0.8125rem;">B</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">BeloAuto Demo</span>
    </div>
    <a href="../../../shared/login.html" style="display:flex;align-items:center;gap:0.375rem;
       font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Entrar
    </a>
  </div>

  <div class="step-container">
    <p class="step-indicator">Passo 4 de 4</p>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--ba-text)">Solicitação enviada!</h2>
    <p data-testid="booking-success">Solicitação enviada! Aguarde a confirmação por email.</p>

    <div class="card" data-testid="booking-submitted-details" style="margin-top:1.25rem;font-size:.875rem;color:var(--ba-text);">
      <p style="font-weight:600;margin-bottom:.5rem;">Detalhes da sua solicitação</p>
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.25rem 0;"><span style="opacity:.7;">Lavagem Completa</span><span style="text-align:right;">R$ 80,00 · 75 min</span></div>
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.25rem 0;"><span style="opacity:.7;">Data e horário</span><span style="text-align:right;">qui, 18 de junho de 2026 · 10:00</span></div>
      <hr style="border:none;border-top:1px solid var(--ba-secondary);margin:.5rem 0;">
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.25rem 0;"><span style="opacity:.7;"><strong>Total</strong></span><span style="text-align:right;"><strong>R$ 80,00 · 75 min</strong></span></div>
    </div>

    <a href="../../../shared/hotsite.html"
      style="display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.5rem;
             border: 1px solid var(--ba-secondary); border-radius: var(--ba-radius);
             color: var(--ba-text); text-decoration: none;">
      Voltar para o site
    </a>
  </div>
</body>
</html>
