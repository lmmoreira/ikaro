<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha a terapeuta — Massagem Relaxante</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    .staff-card { display: flex; align-items: center; gap: 0.875rem; padding: 0.875rem; cursor: pointer; }
    .staff-avatar { width: 3rem; height: 3rem; border-radius: 9999px; flex-shrink: 0; background: var(--ba-primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; }
    .staff-name { font-weight: 600; color: var(--ba-text); }
    .staff-meta { font-size: 0.8125rem; opacity: 0.65; margin-top: 0.125rem; }
  </style>
</head>
<body>

  <!--
    COMPONENT: ResourcePicker  apps/web/features/booking/components/public/ResourcePicker.tsx  (NEW, M23-S11)
    SCENARIO:  bundle — "Massagem Relaxante" has resourceRequirements = [
                 { type: STAFF, selectionMode: CUSTOMER_CHOICE, resourcePoolIds: [Renata, Maria] },
                 { type: ROOM,  selectionMode: AUTO_ANY }
               ] — both must be free for the same window.
    SHOWN:     only the CUSTOMER_CHOICE requirement gets a picker (GET /public/services/:id/resource-options,
               names only). The automatic room is never named before booking (no assignment preview).
    NEXT:      the availability step calls availability with the pick as resourceSelections (M23-S29), which
               intersects the chosen staff, an eligible room and the rest of the bundle (the engine derives the room).
  -->

  <div style="background:white;border-bottom:1px solid var(--ba-secondary);
              padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);
                  color:white;display:flex;align-items:center;justify-content:center;
                  font-weight:700;font-size:0.8125rem;">V</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">Vitta Studio</span>
    </div>
    <a href="../../../shared/login.html" style="display:flex;align-items:center;gap:0.375rem;
       font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Entrar
    </a>
  </div>

  <div class="step-container">
    <p class="step-indicator">Massagem Relaxante — R$ 120,00 — 60 min</p>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.375rem; color: var(--ba-text)">
      Escolha a terapeuta
    </h2>
    <p style="font-size: 0.875rem; opacity: 0.7; margin-bottom: 1.25rem;">
      Sala: atribuída automaticamente
    </p>

    <ul style="display: flex; flex-direction: column; gap: 0.75rem; list-style: none; padding: 0; margin-bottom: 1.5rem;">
      <li>
        <label class="card selected staff-card">
          <input type="radio" name="therapist" checked style="width:1.125rem;height:1.125rem;">
          <div class="staff-avatar" style="background:#db2777;">RS</div>
          <div style="flex:1;">
            <p class="staff-name">Renata Souza</p>
          </div>
        </label>
      </li>
      <li>
        <label class="card staff-card">
          <input type="radio" name="therapist" style="width:1.125rem;height:1.125rem;">
          <div class="staff-avatar" style="background:#c026d3;">MS</div>
          <div style="flex:1;">
            <p class="staff-name">Maria Santos</p>
          </div>
        </label>
      </li>
    </ul>

    <div class="card" style="margin-top:1.25rem;background:#eff6ff">
      <strong>Próximo passo: data e horário</strong>
      <p style="font-size:.875rem;opacity:.75;margin-top:.35rem">Mostraremos apenas horários em que a terapeuta escolhida, uma sala elegível e o kit estejam livres ao mesmo tempo.</p>
    </div>

    <div class="nav-buttons">
      <button class="btn-secondary" onclick="window.history.back()">Voltar</button>
      <a class="btn-primary" href="11-appointment-availability.html?service=massage&amp;staff=renata">Próximo</a>
    </div>
  </div>
</body>
</html>
