<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 2 — Escolha o profissional</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    .staff-card {
      display: flex; align-items: center; gap: 0.875rem;
      padding: 0.875rem; cursor: pointer;
    }
    .staff-avatar {
      width: 3rem; height: 3rem; border-radius: 9999px; flex-shrink: 0;
      background: var(--ba-primary); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem;
    }
    .staff-name { font-weight: 600; color: var(--ba-text); }
    .any-icon { background: #6b7280; }
  </style>
</head>
<body>

  <!--
    COMPONENT: ResourcePicker  apps/web/features/booking/components/public/ResourcePicker.tsx  (NEW, M23-S11)
    SHOWN WHEN: the selected service has a CUSTOMER_CHOICE requirement (e.g. Corte + Escova:
                resourceRequirements = [{ type: STAFF, selectionMode: CUSTOMER_CHOICE }]).
    POSITION:   a step between "01-service-selection" and the availability step; the indicator is computed
                ("Passo 2 de 5" here: services, picker, availability, personal info, confirmation — one more with intake).
    BFF CALL:   GET /public/services/:id/resource-options  (M23-S29, public)
                Response: { requirements: [{ serviceId, legIndex, resourceType, selectionMode, requiredQuantity,
                options: [{ resourceId, name }] }] } — NAME ONLY (no bio/subtitle/avatar data exists); active resources only.
    OUTPUT:     the pick goes to availability and to POST /bookings as resourceSelections.
                Availability then uses M23-S29's resourceSelections param (the staff's own slots for the full service) —
                the explicit resourceId param is NOT used by this flow.
    AUTO_ANY / AUTO_FUNGIBLE_POOL services show no picker (06 / 07).
  -->

  <!-- BRAND + AUTH BAR -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);
              padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);
                  color:white;display:flex;align-items:center;justify-content:center;
                  font-weight:700;font-size:0.8125rem;">V</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">Vitta Studio</span>
    </div>
    <a href="../../../shared/login.html" style="display:flex;align-items:center;gap:0.375rem;
       font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Entrar
    </a>
  </div>

  <div class="step-container">
    <p class="step-indicator">Passo 2 de 5</p>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.375rem; color: var(--ba-text)">
      Escolha o profissional
    </h2>
    <p style="font-size: 0.875rem; opacity: 0.7; margin-bottom: 1.25rem;">
      Corte + Escova — R$ 90,00 — 50 min
    </p>

    <ul style="display: flex; flex-direction: column; gap: 0.75rem; list-style: none; padding: 0;">

      <!-- CUSTOMER_CHOICE options: name only (initials avatar derived from the name) -->
      <li>
        <label class="card selected staff-card">
          <input type="radio" name="staff" checked style="width:1.125rem;height:1.125rem;">
          <div class="staff-avatar">CD</div>
          <div style="flex:1;">
            <p class="staff-name">Camila Duarte</p>
          </div>
        </label>
      </li>

      <li>
        <label class="card staff-card">
          <input type="radio" name="staff" style="width:1.125rem;height:1.125rem;">
          <div class="staff-avatar" style="background:#7c3aed;">BA</div>
          <div style="flex:1;">
            <p class="staff-name">Bruno Alves</p>
          </div>
        </label>
      </li>

    </ul>

    <div class="nav-buttons">
      <button class="btn-secondary" onclick="window.history.back()">Voltar</button>
      <!--
        Reuses the EXISTING SlotPicker/AvailabilityCarousel components, now called with the pick as
        resourceSelections (M23-S29). Same component, narrower query.
      -->
      <a class="btn-primary" href="02-calendar-slot.html">Próximo</a>
    </div>
  </div>
</body>
</html>
