<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 2 — Várias escolhas</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    .staff-card { display:flex; align-items:center; gap:0.875rem; padding:0.875rem; cursor:pointer; }
    .staff-avatar { width:3rem; height:3rem; border-radius:9999px; flex-shrink:0; background:var(--ba-primary); color:white;
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; }
    .staff-name { font-weight:600; color:var(--ba-text); }
    .section-title { font-size:0.875rem; font-weight:700; color:var(--ba-text); margin:1.25rem 0 0.5rem; }
    .section-title small { font-weight:500; opacity:0.65; }
    .hint { font-size:0.8125rem; opacity:0.7; }
    .alert-err { display:flex; align-items:flex-start; gap:0.625rem; background:#fef2f2; border:1.5px solid #fca5a5;
      border-radius:var(--ba-radius); padding:0.75rem 1rem; margin:1rem 0; color:#991b1b; }
    .alert-err p { margin:0; }
    .alert-err .t { font-weight:700; }
    .alert-err .d { font-size:0.8125rem; margin-top:0.25rem; }
    .skeleton { background:linear-gradient(90deg,#e5e7eb,#f3f4f6,#e5e7eb); border-radius:var(--ba-radius); height:4.25rem; margin-bottom:0.75rem; }
    .leg-timeline { position:relative; padding-left:1.75rem; }
    .leg-item { position:relative; padding-bottom:1.5rem; }
    .leg-item:last-child { padding-bottom:0; }
    .leg-dot { position:absolute; left:-1.75rem; top:0.125rem; width:0.75rem; height:0.75rem; border-radius:9999px;
      background:var(--ba-primary); border:2px solid white; box-shadow:0 0 0 1px var(--ba-secondary); }
    .leg-line { position:absolute; left:-1.4375rem; top:0.875rem; bottom:-0.625rem; width:2px; background:var(--ba-secondary); }
    .leg-item:last-child .leg-line { display:none; }
    .leg-time { font-weight:700; color:var(--ba-text); font-size:0.9375rem; }
    .leg-name { font-weight:600; color:var(--ba-primary); font-size:0.9375rem; margin-top:0.125rem; }
    .leg-resource { font-size:0.8125rem; opacity:0.6; margin-top:0.125rem; }
    .transition-note { font-size:0.75rem; opacity:0.6; margin-top:0.375rem; font-style:italic; }
    .row { display:flex; justify-content:space-between; font-size:0.875rem; color:var(--ba-text); padding:0.25rem 0; }
    .btn-disabled { opacity:0.5; cursor:not-allowed; pointer-events:none; }
    .rate { font-size:0.8125rem; opacity:0.75; }
  </style>
</head>
<body>
  <!--
    COMPONENT: ResourcePicker  apps/web/features/booking/components/public/ResourcePicker.tsx  (NEW, M23-S11a) — same component as 05.
    RULE: ANY service — flat or legged — can have a CUSTOMER_CHOICE requirement for each resource type it needs (staff, room, equipment), any
    combination, each independently CUSTOMER_CHOICE / AUTO_ANY / AUTO_FUNGIBLE_POOL. The picker is shown ONCE PER UNIT: a flat service (or bundle)
    is one unit (this screen); a legged service has one unit per leg, each leg that has a choice getting its own full step (05g/05h).
    Sections without a CUSTOMER_CHOICE requirement are not shown, and a unit with none has no step.
    SCENARIO: a SIMPLE (non-legged) service, "Massagem Premium", whose three requirements are all CUSTOMER_CHOICE: STAFF + ROOM + EQUIPMENT ->
    three stacked sections on the ONE step (a flat service is one unit), headings by resource-type label only. If the room were AUTO_ANY, the "Sala" section would simply
    not exist (the picker would show two sections). Próximo stays disabled until every shown section has an explicit pick (nothing pre-selected; the checked staff option shows a partially-filled state).
    INDICATOR: path "resource choice" (no intake) = "Passo 2 de 5".
  -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8125rem;">V</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">Vitta Studio</span>
    </div>
    <a href="../../../shared/login.html" style="font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">Entrar</a>
  </div>
  <div class="step-container">
    <p class="step-indicator">Passo 2 de 5</p>
    <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:0.375rem;color:var(--ba-text)">Faça suas escolhas</h2>
    <p style="font-size:0.875rem;opacity:0.7;margin-bottom:1.25rem;">Massagem Premium — R$ 180,00 — 60 min</p>
    <fieldset style="border:0;padding:0;margin:0;" data-testid="picker-section-staff"><legend class="section-title">Profissional</legend>
    <ul style="display:flex;flex-direction:column;gap:0.75rem;list-style:none;padding:0;">
      <li><label class="card selected staff-card"><input type="radio" name="a" style="width:1.125rem;height:1.125rem;" checked><div class="staff-avatar" style="background:var(--ba-primary);">RS</div><div style="flex:1;"><p class="staff-name">Renata Souza</p></div></label></li>
      <li><label class="card staff-card"><input type="radio" name="a" style="width:1.125rem;height:1.125rem;"><div class="staff-avatar" style="background:#7c3aed;">MS</div><div style="flex:1;"><p class="staff-name">Maria Santos</p></div></label></li>
    </ul>
    </fieldset>
    <fieldset style="border:0;padding:0;margin:0;" data-testid="picker-section-room"><legend class="section-title">Sala</legend>
    <ul style="display:flex;flex-direction:column;gap:0.75rem;list-style:none;padding:0;">
      <li><label class="card staff-card"><input type="radio" name="b" style="width:1.125rem;height:1.125rem;"><div class="staff-avatar" style="background:#6b7280;">S1</div><div style="flex:1;"><p class="staff-name">Sala Aurora</p></div></label></li>
      <li><label class="card staff-card"><input type="radio" name="b" style="width:1.125rem;height:1.125rem;"><div class="staff-avatar" style="background:#6b7280;">S2</div><div style="flex:1;"><p class="staff-name">Sala Horizonte</p></div></label></li>
    </ul>
    </fieldset>
    <fieldset style="border:0;padding:0;margin:0;" data-testid="picker-section-equipment"><legend class="section-title">Equipamento</legend>
    <ul style="display:flex;flex-direction:column;gap:0.75rem;list-style:none;padding:0;">
      <li><label class="card staff-card"><input type="radio" name="c" style="width:1.125rem;height:1.125rem;"><div class="staff-avatar" style="background:#6b7280;">E1</div><div style="flex:1;"><p class="staff-name">Poltrona de relaxamento 1</p></div></label></li>
      <li><label class="card staff-card"><input type="radio" name="c" style="width:1.125rem;height:1.125rem;"><div class="staff-avatar" style="background:#6b7280;">E2</div><div style="flex:1;"><p class="staff-name">Poltrona de relaxamento 2</p></div></label></li>
    </ul>
    </fieldset>
    <p class="hint" style="margin-top:0.75rem;">Escolha uma opção em cada seção para continuar.</p>
    <div class="nav-buttons"><a class="btn-secondary" href="01-service-selection.html">Voltar</a><button class="btn-primary btn-disabled" disabled aria-disabled="true">Próximo</button></div>
  </div>
</body>
</html>
