<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 3 — Data e horário</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    .staff-card { display:flex; align-items:center; gap:0.875rem; padding:0.875rem; cursor:pointer; }
    .staff-avatar { width:3rem; height:3rem; border-radius:9999px; flex-shrink:0; background:var(--ba-primary); color:white;
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; }
    .staff-name { font-weight:600; color:var(--ba-text); }
    .section-title { font-size:0.875rem; font-weight:700; color:var(--ba-text); margin:1.25rem 0 0.5rem; }
    .section-title small { font-weight:500; opacity:0.65; }
    .hint { font-size:0.8125rem; opacity:0.7; }
    .alert-err { display:flex; align-items:flex-start; gap:0.625rem; background:#fef2f2; border:1.5px solid #fca5a5;
      border-radius:var(--ba-radius); padding:0.75rem 1rem; margin:1rem 0; color:#991b1b; }
    .alert-err p { margin:0; }
    .alert-err .t { font-weight:700; }
    .alert-err .d { font-size:0.8125rem; margin-top:0.25rem; }
    .skeleton { background:linear-gradient(90deg,#e5e7eb,#f3f4f6,#e5e7eb); border-radius:var(--ba-radius); height:4.25rem; margin-bottom:0.75rem; }
    .leg-timeline { position:relative; padding-left:1.75rem; }
    .leg-item { position:relative; padding-bottom:1.5rem; }
    .leg-item:last-child { padding-bottom:0; }
    .leg-dot { position:absolute; left:-1.75rem; top:0.125rem; width:0.75rem; height:0.75rem; border-radius:9999px;
      background:var(--ba-primary); border:2px solid white; box-shadow:0 0 0 1px var(--ba-secondary); }
    .leg-line { position:absolute; left:-1.4375rem; top:0.875rem; bottom:-0.625rem; width:2px; background:var(--ba-secondary); }
    .leg-item:last-child .leg-line { display:none; }
    .leg-time { font-weight:700; color:var(--ba-text); font-size:0.9375rem; }
    .leg-name { font-weight:600; color:var(--ba-primary); font-size:0.9375rem; margin-top:0.125rem; }
    .leg-resource { font-size:0.8125rem; opacity:0.6; margin-top:0.125rem; }
    .transition-note { font-size:0.75rem; opacity:0.5; margin-top:0.375rem; font-style:italic; }
    .row { display:flex; justify-content:space-between; font-size:0.875rem; color:var(--ba-text); padding:0.25rem 0; }
    .btn-disabled { opacity:0.5; cursor:not-allowed; pointer-events:none; }
    .rate { font-size:0.8125rem; opacity:0.75; }
  </style>
</head>
<body>
  <!--
    COMPONENTS: AvailabilityStep (+ AvailabilityCarousel / AvailabilityCalendar + SlotPicker) — EXISTING, extended in M23-S11a/b
    SCENARIO:   the SINGLE availability step shared by every flow — simple service, chosen staff, bundle, legged journey, variable
                duration. The query changes the calculation; the interaction does not. There is no separate screen for "automatic"
                resources: the step just shows the slots the engine computes.
    CALLS:      GET /schedule/availability(/summary)?serviceIds=&resourceSelections=&durationMinutes=  (M23-S29)
                - customer picks (05 / 05g) go in resourceSelections; the engine pins them and still intersects the rest of the
                  service (a bundle's room, every leg of a journey, requiredQuantity)
                - AUTO_ANY / pool: no selection — the engine derives the resources
                - CUSTOMER_SELECTED duration (12): durationMinutes
                Both params are OPTIONAL props on the components and part of their effect dependencies, so a changed pick or
                duration always re-fetches (loading = 02b, error = 02c, empty = 02d, day error = 02f); the dashboard
                RescheduleBookingPage, which renders the same components, is unchanged.
                Assignment happens atomically only on booking submission, never as a promise while browsing a slot.
    ERRORS RETURNING HERE: 09b (bundle), 10b (leg), 02e (slot taken).
    INDICATOR:  computed. Shows the path "chosen staff + intake" = "Passo 3 de 6" (the same number applies to "duration + intake").
  -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8125rem;">V</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">Vitta Studio</span>
    </div>
    <a href="../../../shared/login.html" style="font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">Entrar</a>
  </div>
  <div class="step-container">
    <p class="step-indicator">Passo 3 de 6</p>
    <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:0.375rem;color:var(--ba-text)">Escolha data e horário</h2>
    <p style="font-size:0.875rem;opacity:0.7;margin-bottom:1.25rem;">Massagem Relaxante · Renata Souza — os horários já consideram todos os recursos necessários para este serviço.</p>
    <div style="display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem">
      <button class="day-pill unavailable" disabled><span>SEG</span><strong>04</strong></button>
      <button class="day-pill available"><span>TER</span><strong>05</strong></button>
      <button class="day-pill selected"><span>QUA</span><strong>06</strong></button>
      <button class="day-pill available"><span>QUI</span><strong>07</strong></button>
    </div>
    <section style="margin-top:1.5rem"><p class="hint" style="margin-bottom:.75rem">Horários disponíveis — Qua, 06 de agosto</p><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="slot-btn">09:00</button><button class="slot-btn">10:00</button><button class="slot-btn selected">11:00</button><button class="slot-btn">16:00</button></div></section>
    <div class="card" style="margin-top:1.25rem"><strong>11:00 · 60 min</strong><p class="hint" style="margin-top:.3rem;">Massagem Relaxante · R$ 120,00</p></div>
    <div class="nav-buttons"><button class="btn-secondary" onclick="window.history.back()">Voltar</button><a class="btn-primary" href="03d-personal-info-with-intake.html">Próximo</a></div>
  </div>
</body>
</html>
