<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 1 — Serviço por tempo</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    .staff-card { display:flex; align-items:center; gap:0.875rem; padding:0.875rem; cursor:pointer; }
    .staff-avatar { width:3rem; height:3rem; border-radius:9999px; flex-shrink:0; background:var(--ba-primary); color:white;
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; }
    .staff-name { font-weight:600; color:var(--ba-text); }
    .section-title { font-size:0.875rem; font-weight:700; color:var(--ba-text); margin:1.25rem 0 0.5rem; }
    .section-title small { font-weight:500; opacity:0.65; }
    .hint { font-size:0.8125rem; opacity:0.7; }
    .alert-err { display:flex; align-items:flex-start; gap:0.625rem; background:#fef2f2; border:1.5px solid #fca5a5;
      border-radius:var(--ba-radius); padding:0.75rem 1rem; margin:1rem 0; color:#991b1b; }
    .alert-err p { margin:0; }
    .alert-err .t { font-weight:700; }
    .alert-err .d { font-size:0.8125rem; margin-top:0.25rem; }
    .skeleton { background:linear-gradient(90deg,#e5e7eb,#f3f4f6,#e5e7eb); border-radius:var(--ba-radius); height:4.25rem; margin-bottom:0.75rem; }
    .leg-timeline { position:relative; padding-left:1.75rem; }
    .leg-item { position:relative; padding-bottom:1.5rem; }
    .leg-item:last-child { padding-bottom:0; }
    .leg-dot { position:absolute; left:-1.75rem; top:0.125rem; width:0.75rem; height:0.75rem; border-radius:9999px;
      background:var(--ba-primary); border:2px solid white; box-shadow:0 0 0 1px var(--ba-secondary); }
    .leg-line { position:absolute; left:-1.4375rem; top:0.875rem; bottom:-0.625rem; width:2px; background:var(--ba-secondary); }
    .leg-item:last-child .leg-line { display:none; }
    .leg-time { font-weight:700; color:var(--ba-text); font-size:0.9375rem; }
    .leg-name { font-weight:600; color:var(--ba-primary); font-size:0.9375rem; margin-top:0.125rem; }
    .leg-resource { font-size:0.8125rem; opacity:0.6; margin-top:0.125rem; }
    .transition-note { font-size:0.75rem; opacity:0.5; margin-top:0.375rem; font-style:italic; }
    .row { display:flex; justify-content:space-between; font-size:0.875rem; color:var(--ba-text); padding:0.25rem 0; }
    .btn-disabled { opacity:0.5; cursor:not-allowed; pointer-events:none; }
    .rate { font-size:0.8125rem; opacity:0.75; }
  </style>
</head>
<body>
  <!--
    COMPONENT: ServiceSelectionStep  apps/web/features/booking/components/public/ServiceSelectionStep.tsx  (EXISTS — extended by M23-S11a)
    Cards are type-aware (HotsiteServiceResponse.bookingPolicy). Only bookingModel = APPOINTMENT services are listed (class
    services never appear — class entry is M24-S20). Each card carries data-service-id="<uuid>" (E2E hook, not visible).
    SCENARIO: a CUSTOMER_SELECTED-duration service with a per-time pricing policy. The card shows the RATE from
    bookingPolicy (pricePerIncrementAmount per pricingIncrementMinutes — formatted with useFormatting in the TENANT currency,
    never a hard-coded one) and the duration RANGE (durationMin–durationMax), not a fixed price/duration.
    The selection total reads "a partir de <minimumCharge or one increment>" until a duration is chosen on the next step
    (BookingSummaryCard too). A fixed-price service in the same basket still shows its fixed price.
    INDICATOR: 4 until the customer leaves Step 1 (the final total is only known after the intake-schema fetch).
  -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8125rem;">V</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">Vitta Studio</span>
    </div>
    <a href="../../../shared/login.html" style="font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">Entrar</a>
  </div>
  <div class="step-container">
    <p class="step-indicator">Passo 1 de 4</p>
    <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:0.375rem;color:var(--ba-text)">Escolha os serviços</h2>
    <ul style="display:flex;flex-direction:column;gap:0.75rem;list-style:none;padding:0;">
      <li><label class="card" data-service-id="svc-haircut" style="display:flex;gap:0.75rem;align-items:flex-start;cursor:pointer;"><input type="checkbox" style="margin-top:0.25rem;width:1.125rem;height:1.125rem;"><div style="flex:1;"><p style="font-weight:600;color:var(--ba-text);">Corte + Escova</p><p class="hint">Corte e finalização</p></div><div style="text-align:right;"><p style="font-weight:600;color:var(--ba-text);">R$ 90,00</p><p class="rate">50 min</p></div></label></li>
      <li><label class="card selected" data-service-id="svc-meeting-room" style="display:flex;gap:0.75rem;align-items:flex-start;cursor:pointer;"><input type="checkbox" checked style="margin-top:0.25rem;width:1.125rem;height:1.125rem;"><div style="flex:1;"><p style="font-weight:600;color:var(--ba-text);">Sala de reunião</p><p class="hint">Reserva exclusiva por tempo</p></div><div style="text-align:right;"><p style="font-weight:600;color:var(--ba-text);">R$ 50,00 / hora</p><p class="rate">1 h a 8 h</p></div></label></li>
    </ul>
    <p style="font-weight:600;color:var(--ba-text);margin-top:1rem;" data-testid="selection-total">1 serviço — a partir de R$ 50,00 — duração a escolher</p>
    <p class="hint">O total final aparece depois que você escolher a duração.</p>
    <div class="nav-buttons"><a class="btn-secondary" href="00-hotsite.html">Voltar</a><a class="btn-primary" href="05-staff-picker.html">Próximo</a></div>
  </div>
</body>
</html>
