<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 1 — Formulário de contato — erro ao enviar</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
</head>
<body>
  <!--
    Variant: generic submission failure — a network error or an unexpected 5xx from
    POST /public/platform/lead-form/:slug/submissions. Distinct from the three specific,
    already-mocked failure cases (01c-validation-error.html = 400 field errors,
    01d-captcha-error.html = Turnstile failure, 01e-rate-limited.html = 429 daily cap) —
    this is "something went wrong that isn't the visitor's fault and isn't a known,
    named error code." "Tentar novamente" resubmits the same already-filled data
    (unlike the captcha-error screen, this one doesn't need to redo the Turnstile challenge
    unless the retry itself fails again).
  -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8125rem;">B</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">BeloAuto Demo</span>
    </div>
    <a href="../../../shared/login.html" style="font-size:0.875rem;color:var(--ba-primary);text-decoration:none;">Entrar</a>
  </div>
  <main class="step-container">
    <div class="card" style="text-align:center;padding:2.5rem 1.5rem;">
      <div style="width:3rem;height:3rem;border-radius:9999px;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;">⚠</div>
      <h1 style="font-size:1.25rem;font-weight:700;color:var(--ba-text);margin-bottom:0.5rem;">Não foi possível enviar</h1>
      <p style="opacity:0.65;line-height:1.55;max-width:26rem;margin:0 auto 1.5rem;">Algo deu errado do nosso lado. Seus dados preenchidos não foram perdidos — tente novamente em instantes.</p>
      <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
        <a href="01-form.html" class="btn-primary">Tentar novamente</a>
        <a href="../../../shared/hotsite.html" class="btn-secondary">Voltar ao site</a>
      </div>
    </div>
  </main>
</body>
</html>
