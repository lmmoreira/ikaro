<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispensar — Vitta Studio</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    .intro{opacity:.7;font-size:.875rem;margin:0 0 1rem}
    .group{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin:1.25rem 0 .5rem}
    .group h2{font-size:.9375rem;font-weight:700;margin:0;color:var(--ba-text)}
    .group a{font-size:.8125rem;font-weight:600;color:#2563eb;text-decoration:none}
    .item{display:flex;gap:.75rem;border:1px solid var(--ba-secondary);border-left:4px solid #f59e0b;border-radius:var(--ba-radius);padding:1rem;margin:.625rem 0;background:#fff}
    .item.selected{background:#eff6ff;border-color:#93c5fd;border-left-color:#2563eb}
    .item.done{border-left-color:#16a34a;background:#f0fdf4}
    .item.open{border-left-color:#dc2626;background:#fef2f2}
    .chk{width:1.125rem;height:1.125rem;margin-top:.2rem;flex-shrink:0;accent-color:#2563eb}
    .body{flex:1;min-width:0}
    .title{font-size:.9375rem;font-weight:700;color:var(--ba-text)}
    .meta{font-size:.8125rem;opacity:.7;margin:.25rem 0 .5rem;color:var(--ba-text)}
    .badge{display:inline-block;font-size:.6875rem;font-weight:700;padding:.125rem .5rem;border-radius:9999px;margin-left:.375rem;vertical-align:middle}
    .b-ok{background:#dcfce7;color:#166534}.b-wait{background:#fef3c7;color:#92400e}
    .alt{font-size:.8125rem;background:#eff6ff;border-radius:var(--ba-radius);padding:.5rem .75rem;margin:.5rem 0}
    .alt.none{background:#f3f4f6;color:#4b5563}
    .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
    .actions a{font-size:.8125rem;font-weight:600;color:#2563eb;text-decoration:none;padding:.25rem .625rem;border:1.5px solid #bfdbfe;border-radius:9999px;background:#fff}
    .actions a.danger{color:#b91c1c;border-color:#fecaca}
    .actions span{font-size:.8125rem;font-weight:600;opacity:.4;padding:.25rem .625rem;border:1.5px dashed var(--ba-secondary);border-radius:9999px;cursor:not-allowed}
    .bar{position:sticky;bottom:0;background:#1e3a8a;color:#fff;border-radius:var(--ba-radius);padding:.75rem 1rem;margin-top:1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
    .bar strong{margin-right:auto}
    .bar a{color:#fff;font-size:.8125rem;font-weight:600;text-decoration:none;padding:.375rem .75rem;border:1.5px solid rgba(255,255,255,.5);border-radius:9999px}
    .bar span{font-size:.8125rem;opacity:.55;padding:.375rem .75rem;border:1.5px dashed rgba(255,255,255,.35);border-radius:9999px;cursor:not-allowed}
    .panel{border:1px solid var(--ba-secondary);border-radius:var(--ba-radius);padding:1rem;background:#fff;margin:.75rem 0}
    .panel h3{margin:0 0 .5rem;font-size:1rem}
    .opt{display:flex;gap:.625rem;align-items:flex-start;padding:.625rem;border:1.5px solid var(--ba-secondary);border-radius:var(--ba-radius);margin:.5rem 0;font-size:.875rem}
    .opt.on{border-color:#2563eb;background:#eff6ff}
    .opt small{display:block;opacity:.65;margin-top:.125rem}
    .btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
    .note{font-size:.8125rem;opacity:.7}
    .banner{border-radius:var(--ba-radius);padding:.75rem 1rem;margin:.75rem 0;font-size:.875rem}
    .banner.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
    .banner.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
    .skeleton{height:5.5rem;border-radius:var(--ba-radius);background:linear-gradient(90deg,#eef2f7,#f8fafc,#eef2f7);margin:.625rem 0}
    .empty{text-align:center;padding:3rem 1rem;opacity:.8}
    .empty strong{display:block;font-size:1rem;margin-bottom:.375rem}
  </style>
</head>
<body>
  <!-- Dismiss needs a reason (UC-077 A2); keep does not. Both apply to one or many entries. -->
  <div class="dashboard-topbar"><a href="../../../staff/prototypes/horarios/08-visao-geral-manager.html" style="color:var(--ba-text);text-decoration:none">← Início</a><h1 class="topbar-page-title">Dispensar compromisso</h1></div>
  <main class="dashboard-body" style="max-width:48rem;margin:0 auto">
    <div class="panel"><h3>Dispensar este compromisso</h3>
      <p class="note">Use quando o compromisso não precisa mais de ação. A reserva não muda. Para <strong>manter</strong> a reserva como está mesmo assim, use "Manter" (o motivo é opcional).</p>
      <label for="d" style="font-size:.8125rem">Motivo <span style="color:#b91c1c">*</span></label>
      <input id="d" class="form-input" placeholder="Ex.: Camila voltou a atender neste dia">
      <p class="note" style="color:#b91c1c;display:none">Informe o motivo para dispensar.</p>
      <div class="btn-row"><a class="btn-primary" href="01d-resultado-parcial.html">Dispensar</a><a class="btn-secondary" href="01-exception-worklist.html">Voltar</a></div>
    </div>
  </main>
</body>
</html>
