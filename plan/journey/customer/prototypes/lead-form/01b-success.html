<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 1 — Formulário de contato — recebido (cliente logado)</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
</head>
<body>
  <!--
    Variant: UC-040 success — same as guest/prototypes/lead-form/01f-success.html, but with the
    authenticated avatar-dropdown auth bar this customer journey uses throughout (01-form-prefilled.html
    uses the same header). A real bug fix: 01-form-prefilled.html's "Enviar" link used to point at
    the guest success screen, which shows the wrong (unauthenticated, plain "Entrar") auth bar — this
    screen is the correctly-authenticated replacement.
  -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8125rem;">B</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">BeloAuto Demo</span>
    </div>
    <div style="position:relative;">
      <details>
        <summary class="auth-avatar" style="list-style:none;cursor:pointer;">MF</summary>
        <div style="position:absolute;right:0;top:2.25rem;background:white;border:1px solid var(--ba-secondary);border-radius:var(--ba-radius);box-shadow:var(--ba-shadow);min-width:9rem;padding:0.375rem;">
          <a href="../../../shared/hotsite-logged-in.html" style="display:block;padding:0.5rem 0.625rem;font-size:0.875rem;color:var(--ba-text);text-decoration:none;">Minha conta</a>
          <a href="../../../shared/login.html" style="display:block;padding:0.5rem 0.625rem;font-size:0.875rem;color:var(--ba-text);text-decoration:none;">Sair</a>
        </div>
      </details>
    </div>
  </div>
  <main class="step-container">
    <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:var(--ba-radius);padding:1.125rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:flex-start;gap:0.875rem;">
      <div style="width:2rem;height:2rem;border-radius:9999px;background:#16a34a;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div>
        <p style="font-weight:700;font-size:0.9375rem;color:#15803d;margin-bottom:0.125rem;">Recebemos sua mensagem!</p>
        <p style="font-size:0.875rem;color:#166534;opacity:0.85;line-height:1.5;">Nossa equipe entra em contato pelo e-mail ou telefone informado em até 1 dia útil.</p>
      </div>
    </div>
    <a href="../../../shared/hotsite-logged-in.html" class="btn-secondary">Voltar ao site</a>
  </main>
</body>
</html>
