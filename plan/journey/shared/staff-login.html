<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Área da Equipe Ikaro</title>
  <link rel="stylesheet" href="./tokens.css">
</head>
<body>

  <!--
    SHARED FILE — plan/journey/shared/staff-login.html
    Used by: all staff / manager journey prototypes that start from login
    Do not duplicate per actor — link here via ../../../shared/staff-login.html

    COMPONENT: StaffLoginPage
    FILE:      apps/web/app/dashboard/login/page.tsx  (EXISTS)
    ROUTE:     /dashboard/login?tenantSlug={slug}  — tenantSlug is REQUIRED;
               see 00b-no-tenant-slug.html for the state shown when it's missing.
    Auth guard: none (public server component, no data fetching)
    Styling:   fixed Tailwind gray/indigo palette — NOT tenant-branded. DashboardShell
               and every screen reached from it are tenant-agnostic (CLAUDE.md "Web
               styling boundary"), unlike the hotsite/booking flow. The --ba-* tokens
               below are prototype-file plumbing only, not a claim that this page uses
               tenant branding in production.

    ── UC-022 Regular Login ──────────────────────────────────────────────────
    1. Staff visits /dashboard/login?tenantSlug={slug} (linked from the tenant's hotsite)
    2. Clicks "Entrar com Google" → buildGoogleOAuthUrl({ tenantSlug, type: 'staff' })
       → GET {BFF_URL}/auth/google?tenantSlug={slug}&type=staff
    3. Google OAuth consent
    4. Callback → BFF resolves staff by googleOAuthId
    5a. Active   → JWT cookie → redirect /dashboard/bookings
    5b. Inactive → redirect /auth/first-login  (invite not yet accepted)
    5c. Not found → redirect /auth/error?reason=not-a-staff-member

    ── UC-025 First Login / Accept Invite ───────────────────────────────────
    Staff receives invite email with a link that encodes the tenant slug directly:
      GET {BFF_URL}/auth/google?tenantSlug={slug}&type=staff
    Callback → BFF activates the staff record → issues JWT → /dashboard/bookings
    In prototype: the "Primeiro acesso?" link is informational only.

    NOT built: any inline error banner on this page. A prior dev-notes.md draft
    proposed one (?error= query param) but the real page.tsx never implements it —
    errors always redirect to the separate /auth/error page instead.
  -->

  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb;">
    <div style="width: 100%; max-width: 24rem; padding: 2.25rem; text-align: center; background: white; border-radius: 0.5rem;">

      <!-- Logo mark — fixed indigo, not tenant-branded -->
      <div style="
        width: 4rem; height: 4rem;
        background: #4f46e5; border-radius: 0.75rem;
        margin: 0 auto 1.5rem;
        display: flex; align-items: center; justify-content: center;
      ">
        <span style="color: white; font-weight: 700; font-size: 1.25rem;">I</span>
      </div>

      <h1 style="font-size: 1.5rem; font-weight: 700; color: #111827;">
        Área da Equipe
      </h1>
      <p style="font-size: 0.875rem; color: #6b7280; margin-top: 0.5rem; margin-bottom: 2rem;">
        Acesso exclusivo para funcionários e gerentes
      </p>

      <!--
        GOOGLE SIGN-IN BUTTON — real markup/copy from apps/web/app/dashboard/login/page.tsx.
        In prototype: simulates successful login → goes to the real Agenda page
        (dashboard-shell.html is a generic master template for building new staff
        pages, not a finished page itself — see its own header comment).
      -->
      <a
        href="../staff/prototypes/agenda/00-agenda.html"
        style="
          display: flex; align-items: center; justify-content: center; gap: 0.75rem;
          border: 1px solid #e5e7eb; border-radius: 0.5rem;
          padding: 0.75rem 1.5rem; width: 100%;
          text-decoration: none; color: #111827;
          font-weight: 600; font-size: 0.875rem;
          box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        "
      >
        <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z" fill="#FFC107"/>
          <path d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" fill="#FF3D00"/>
          <path d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A12 12 0 0 1 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z" fill="#4CAF50"/>
          <path d="M43.6 20.1H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z" fill="#1976D2"/>
        </svg>
        Entrar com Google
      </a>

      <!--
        ERROR STATES — canonical copy lives in the 01b–01h variant screens in
        staff/prototypes/login/ (7 reason codes today: not-a-staff-member,
        staff-deactivated, email-mismatch, invite-not-found,
        account-linked-elsewhere, tenant-not-found, tenant-deactivated).
        Do not duplicate the error copy here — link out instead.
      -->
      <p style="margin-top: 1.25rem; font-size: 0.8125rem; text-align: center;">
        <a href="../staff/prototypes/login/01b-error.html" style="color: #dc2626;">
          Ver estados de erro (7 variantes) →
        </a>
      </p>

      <p style="margin-top: 1.5rem; font-size: 0.75rem; color: #9ca3af;">
        Primeiro acesso? Use o link enviado no e-mail de convite.
      </p>

      <!-- Prototype-only navigation aid — no such link exists on the real page.tsx -->
      <p style="margin-top: 1.25rem; font-size: 0.75rem; opacity: 0.4; color: var(--ba-text);">
        <a href="./hotsite.html" style="color: var(--ba-primary);">← Voltar ao site público (apenas no protótipo)</a>
      </p>

    </div>
  </div>

</body>
</html>
