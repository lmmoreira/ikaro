<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Agendamentos — Vitta Studio</title>
  <link rel="stylesheet" href="../../../../plan/journey/shared/tokens.css">
  <style>
    .customer-nav { display: none; background: white; border-bottom: 1px solid var(--ba-secondary); padding: 0 1.5rem; position: sticky; top: 3.375rem; z-index: 5; }
    .customer-nav-item { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 500; color: var(--ba-text); text-decoration: none; border-bottom: 2px solid transparent; opacity: 0.5; }
    .customer-nav-item.active { color: var(--ba-primary); border-bottom-color: var(--ba-primary); opacity: 1; }
    .booking-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 0; border-bottom: 1px solid var(--ba-secondary); }
    .booking-item:last-child { border-bottom: none; }
    .booking-item-icon { width: 2.125rem; height: 2.125rem; border-radius: var(--ba-radius); background: var(--ba-secondary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .booking-item-info { flex: 1; min-width: 0; }
    .booking-item-name { font-weight: 600; font-size: 0.9375rem; color: var(--ba-text); }
    .booking-item-meta { font-size: 0.8125rem; opacity: 0.55; color: var(--ba-text); margin-top: 0.125rem; }
    .booking-item-aside { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; flex-shrink: 0; }
    .section-label { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(17,24,39,0.4); margin-bottom: 0.625rem; }
    .recurring-tag { font-size: 0.6875rem; font-weight: 700; color: var(--ba-primary); background: var(--ba-secondary); padding: 0.125rem 0.4375rem; border-radius: 4px; }
    @media (min-width: 1024px) { .customer-nav { display: flex; } }
  </style>
</head>
<body>

  <!--
    DISCOVERY PROTOTYPE — illustrative only, NOT a plan/journey/ prototype. Screen 3 of 6
    in the recurring-enrollment sequence.

    Reuses the REAL, existing Minha Conta shell — not invented fresh — from
    plan/journey/customer/prototypes/minha-conta/01-minha-conta.html. Same tab nav
    (Início / Agendamentos / Fidelidade), same booking-item list pattern.

    Finding worth keeping: a recurring booking surfaces INSIDE the existing
    "Agendamentos" tab (Próximos section), tagged, not as a separate new tab — no new
    top-level customer-facing IA needed for this feature, unlike the staff/manager side
    where "Turmas" is a new nav section entirely.
  -->

  <div style="background:#fef3c7;border-bottom:1px solid #d97706;padding:0.375rem 1rem;font-size:0.8125rem;text-align:center;color:#92400e;">
    Protótipo — sequência de recorrência, tela 3 de 6
  </div>

  <div class="dashboard-topbar">
    <div class="topbar-brand"><div class="topbar-logo-mark">V</div><span class="topbar-tenant-name">Vitta Studio</span></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:0.75rem;">
      <div class="auth-avatar" style="width:2rem;height:2rem;font-size:0.8125rem;">FL</div>
    </div>
  </div>

  <div class="customer-nav">
    <a class="customer-nav-item" href="../../../../plan/journey/shared/customer-dashboard.html">🏠 Início</a>
    <a class="customer-nav-item active" href="customer-03-minha-conta-agendamentos.html">📅 Agendamentos</a>
    <a class="customer-nav-item" href="../../../../plan/journey/customer/prototypes/minha-conta/04-fidelidade.html">⭐ Fidelidade</a>
  </div>

  <div class="dashboard-layout">
    <main class="main-content">
      <div class="dashboard-body">

        <h1 style="font-size:1.125rem;font-weight:700;color:var(--ba-text);margin-bottom:1rem;">Meus Agendamentos</h1>

        <p class="section-label">Próximos <span style="opacity:.5;">(1)</span></p>
        <div class="card" style="padding:0 1rem;margin-bottom:1.5rem;">
          <div class="booking-item">
            <div class="booking-item-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ba-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="booking-item-info">
              <p class="booking-item-name">Pilates <span class="recurring-tag">🔁 Recorrente</span></p>
              <p class="booking-item-meta">Seg, 11 ago · 08h00</p>
            </div>
            <div class="booking-item-aside">
              <span class="status-badge status-approved">Confirmado</span>
              <a href="customer-04-gerenciar-recorrencia.html" style="font-size:0.75rem;color:var(--ba-primary);text-decoration:none;font-weight:600;">Gerenciar recorrência</a>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a class="bottom-nav-item" href="../../../../plan/journey/shared/customer-dashboard.html">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Início
    </a>
    <a class="bottom-nav-item active" href="customer-03-minha-conta-agendamentos.html">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Agendamentos
    </a>
    <a class="bottom-nav-item" href="../../../../plan/journey/customer/prototypes/minha-conta/04-fidelidade.html">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Fidelidade
    </a>
  </nav>

</body>
</html>
