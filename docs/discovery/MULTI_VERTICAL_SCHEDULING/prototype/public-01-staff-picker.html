<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passo 2 — Escolha o profissional</title>
  <link rel="stylesheet" href="../../../../plan/journey/shared/tokens.css">
  <style>
    .staff-card {
      display: flex; align-items: center; gap: 0.875rem;
      padding: 0.875rem; cursor: pointer;
    }
    .staff-avatar {
      width: 3rem; height: 3rem; border-radius: 9999px; flex-shrink: 0;
      background: var(--ba-primary); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem;
    }
    .staff-name { font-weight: 600; color: var(--ba-text); }
    .staff-meta { font-size: 0.8125rem; opacity: 0.65; margin-top: 0.125rem; }
    .any-icon { background: #6b7280; }
  </style>
</head>
<body>

  <!--
    DISCOVERY PROTOTYPE — illustrative only, NOT a plan/journey/ prototype.
    See ../../MULTI_VERTICAL_SCHEDULING.md (§5 Appointment-Style Deep Dive)
    and ../../MULTI_VERTICAL_SCHEDULING_USECASES.md (CAND-16, CAND-17b).
    Corrected on review (2026-07-29): the "any available" card below was originally
    mislabeled CAND-17 — CAND-17 is scoped to ROOM/EQUIPMENT fungible pools only, not
    STAFF. The real match is CAND-17b (added on the same review), though note this
    screen shows it as one radio option alongside named choices (still within a
    CUSTOMER_CHOICE picker) rather than CAND-17b's "no picker shown at all" flow —
    a hybrid worth resolving if this direction gets built for real.

    Represents taxonomy model #2 (per-staff exclusive, customer-chosen) and #3
    (per-staff exclusive, system-assigned) — Vitta Studio's "Corte + Escova" service
    has resourceRequirements = [{ type: STAFF, selectionMode: CUSTOMER_CHOICE }].

    This is a NEW step inserted into today's guest booking flow, between
    "01-service-selection" and "02-calendar-slot" (see guest/prototypes/book-a-service/).
    Today's flow has no such step — the whole tenant is the only resource.

    COMPONENT (GAP): StaffPickerStep
    FILE: apps/web/components/booking/StaffPickerStep.tsx
    BFF CALL (GAP): GET /resources?type=STAFF&serviceId=svc_corte_escova
      Response: { resourceId, name, subtitle, hasAvailabilityToday }[]
  -->

  <!-- BRAND + AUTH BAR -->
  <div style="background:white;border-bottom:1px solid var(--ba-secondary);
              padding:0.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:0.625rem;">
      <div style="width:1.875rem;height:1.875rem;border-radius:0.375rem;background:var(--ba-primary);
                  color:white;display:flex;align-items:center;justify-content:center;
                  font-weight:700;font-size:0.8125rem;">V</div>
      <span style="font-weight:700;font-size:0.9375rem;color:var(--ba-text);">Vitta Studio</span>
    </div>
    <a href="../../../../plan/journey/shared/login.html" style="display:flex;align-items:center;gap:0.375rem;
       font-size:0.875rem;font-weight:500;color:var(--ba-primary);text-decoration:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Entrar
    </a>
  </div>

  <div class="step-container">
    <p class="step-indicator">Passo 2 de 5</p>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.375rem; color: var(--ba-text)">
      Escolha o profissional
    </h2>
    <p style="font-size: 0.875rem; opacity: 0.7; margin-bottom: 1.25rem;">
      Corte + Escova — R$ 90,00 — 50 min
    </p>

    <ul style="display: flex; flex-direction: column; gap: 0.75rem; list-style: none; padding: 0;">

      <!-- "Any available" — CAND-17b (system-auto-assigned named staff), shown here as an
           opt-in choice within a CUSTOMER_CHOICE picker rather than CAND-17b's stricter
           "no picker at all" flow. Staff still has a name once booked, unlike a truly
           fungible pool (courts/bays, CAND-17) where no identity is ever shown. -->
      <li>
        <label class="card staff-card">
          <input type="radio" name="staff" style="width:1.125rem;height:1.125rem;">
          <div class="staff-avatar any-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div style="flex:1;">
            <p class="staff-name">Qualquer profissional disponível</p>
            <p class="staff-meta">Reserva mais rápida — combinamos com quem estiver livre</p>
          </div>
        </label>
      </li>

      <!-- Named staff, selected — CAND-16 -->
      <li>
        <label class="card selected staff-card">
          <input type="radio" name="staff" checked style="width:1.125rem;height:1.125rem;">
          <div class="staff-avatar">CD</div>
          <div style="flex:1;">
            <p class="staff-name">Camila Duarte</p>
            <p class="staff-meta">Coloração e cortes modernos</p>
          </div>
        </label>
      </li>

      <li>
        <label class="card staff-card">
          <input type="radio" name="staff" style="width:1.125rem;height:1.125rem;">
          <div class="staff-avatar" style="background:#7c3aed;">BA</div>
          <div style="flex:1;">
            <p class="staff-name">Bruno Alves</p>
            <p class="staff-meta">Especialista em cortes masculinos</p>
          </div>
        </label>
      </li>

    </ul>

    <div class="nav-buttons">
      <button class="btn-secondary" onclick="window.history.back()">Voltar</button>
      <!--
        Reuses the EXISTING SlotPicker/AvailabilityCarousel components from
        guest/prototypes/book-a-service/02-calendar-slot.html, now called with
        resourceId=<chosen staff>. Same component, narrower query — nothing new
        needed on the calendar screen itself.
      -->
      <a class="btn-primary" href="../../../../plan/journey/guest/prototypes/book-a-service/02-calendar-slot.html">Próximo</a>
    </div>
  </div>
</body>
</html>
