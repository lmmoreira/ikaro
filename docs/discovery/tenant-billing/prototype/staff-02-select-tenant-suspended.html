<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecione o estabelecimento — Ikaro</title>
  <link rel="stylesheet" href="../../../../journeys/shared/tokens.css">
</head>
<body>

  <!--
    DISCOVERY PROTOTYPE -- illustrative only, NOT a journeys/ prototype.
    Grounds CAND-16 (suspended tenant behaviour): the post-login tenant switch screen KEEPS listing a suspended tenant, marked with a "Suspensa" badge, still selectable. Never hidden.
    Only the badge is shown to staff: no reason (NON_PAYMENT/CANCELED), no payment info (they are not the payer). Selecting the row switches the session as usual and the dashboard layout then renders the suspended notice (staff-01-suspended-notice.html).
    ROUTE: /select-staff-tenant (apps/web/app/select-staff-tenant/page.tsx)
    COMPONENT: SelectStaffTenantClient (apps/web/features/staff/components/SelectStaffTenantClient.tsx) -- EXISTS (list, role badge Gerente/Funcionário, error state). The "Suspensa" badge is a GAP: add a conditional second badge when `operational === false`.
    BFF CALL: GET /auth/staff-tenants -> StaffTenantOption[] { staffId, tenantId, tenantSlug, tenantName, role, operational } -- the existing tenant-selection endpoint must include a per-tenant `operational` flag (false when subscription status = SUSPENDED). Selecting: POST /auth/switch-staff-tenant { staffId } (unchanged, must NOT reject a suspended tenant).
  -->

  <div style="background:#fef3c7;border-bottom:1px solid #d97706;padding:0.375rem 1rem;font-size:0.8125rem;text-align:center;color:#92400e;">
    Protótipo — CAND-16 — Troca de estabelecimento mostra a empresa suspensa
  </div>

  <main style="display:flex;min-height:calc(100vh - 2rem);align-items:center;justify-content:center;background:#f9fafb;padding:0 1.5rem;">
    <div style="width:100%;max-width:28rem;border-radius:0.75rem;background:white;padding:2.25rem;box-shadow:0 1px 2px rgba(0,0,0,0.05);box-sizing:border-box;">
      <h1 style="margin:0 0 0.375rem;font-size:1.25rem;font-weight:700;color:#111827;">Selecione o estabelecimento</h1>
      <p style="margin:0 0 1.5rem;font-size:0.875rem;color:#6b7280;">Sua conta tem acesso a mais de um estabelecimento.</p>

      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.75rem;">
        <li>
          <a href="#" style="display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:space-between;border:1px solid #e5e7eb;border-radius:0.5rem;padding:1rem 1.25rem;background:white;text-decoration:none;">
            <span style="font-weight:500;color:#111827;">AutoWash Pro</span>
            <span style="border-radius:9999px;padding:0.125rem 0.5rem;font-size:0.75rem;font-weight:600;background:#ede9fe;color:#6d28d9;">Gerente</span>
          </a>
        </li>
        <li>
          <!-- Suspended tenant: still selectable, goes to the suspended notice -->
          <a href="staff-01-suspended-notice.html" style="display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:space-between;gap:0.5rem;border:1px solid #e5e7eb;border-radius:0.5rem;padding:1rem 1.25rem;background:white;text-decoration:none;">
            <span style="font-weight:500;color:#111827;">Lavacar BeloAuto</span>
            <span style="display:flex;gap:0.375rem;flex-shrink:0;">
              <span style="border-radius:9999px;padding:0.125rem 0.5rem;font-size:0.75rem;font-weight:600;background:#fef3c7;color:#92400e;">Suspensa</span>
              <span style="border-radius:9999px;padding:0.125rem 0.5rem;font-size:0.75rem;font-weight:600;background:#f3f4f6;color:#374151;">Funcionário</span>
            </span>
          </a>
        </li>
        <li>
          <a href="#" style="display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:space-between;border:1px solid #e5e7eb;border-radius:0.5rem;padding:1rem 1.25rem;background:white;text-decoration:none;">
            <span style="font-weight:500;color:#111827;">SuperClean</span>
            <span style="border-radius:9999px;padding:0.125rem 0.5rem;font-size:0.75rem;font-weight:600;background:#f3f4f6;color:#374151;">Funcionário</span>
          </a>
        </li>
      </ul>
    </div>
  </main>

</body>
</html>
