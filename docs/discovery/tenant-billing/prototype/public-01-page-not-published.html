<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Página não publicada — Lavacar BeloAuto</title>
  <link rel="stylesheet" href="../../../../journeys/shared/tokens.css">

<body>

  <!--
    DISCOVERY PROTOTYPE -- illustrative only, NOT a journeys/ prototype.
    Grounds the SUSPENDED behaviour for the PUBLIC hotsite (CAND-17). The tenant's hotsite is replaced by a reason-neutral "Página não publicada" page (never says suspended / unpaid / canceled). The top bar (HotsiteAuthBar) stays: the staff entry and the customer "Entrar" remain reachable so staff/managers and customers can still log in.
    COMPONENT (CHANGED: Unavailable gains HotsiteAuthBar, used for every unpublished hotsite; new copy variant): apps/web/shells/hotsite/components/Unavailable.tsx -- currently renders "Em breve" (tenant has no published hotsite yet). This screen is a NEW COPY VARIANT of the same <Unavailable /> (e.g. variant="suspended": title "Página não publicada" + one neutral line). HotsiteAuthBar (EXISTS) is unchanged. No tenant branding beyond the existing --ba-* tokens.
    BFF CALL: GET /v1/public/platform/manifest/:slug -> manifest unavailable (as for an unpublished hotsite); the shell decides the variant from the same response (no billing detail exposed publicly).
    Label note: the real HotsiteAuthBar entry reads "Área da Equipe" (shared/hotsite.html); the discovery brief calls it "Login da equipe" -- same link, real label kept here.
  -->

  <div style="background:#fef3c7;border-bottom:1px solid #d97706;padding:0.375rem 1rem;font-size:0.8125rem;text-align:center;color:#92400e;">
    Protótipo — CAND-17 — Hotsite de empresa suspensa (visitante)
  </div>

  <div class="auth-bar" style="justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <div style="width:1.75rem;height:1.75rem;border-radius:9999px;background:var(--ba-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8125rem;flex-shrink:0;">L</div>
      <span style="font-weight: 700; font-size: 0.875rem; color: var(--ba-text);">Lavacar BeloAuto</span>
      <a href="../../../../journeys/shared/staff-login.html" style="display: flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; font-weight: 500; color: rgba(17,24,39,0.4); text-decoration: none; margin-left: 0.375rem; padding-left: 0.75rem; border-left: 1px solid rgba(17,24,39,0.12);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Área da Equipe
      </a>
    </div>
    <a href="../../../../journeys/shared/login.html" style="display: flex; align-items: center; gap: 0.375rem; font-size: 0.875rem; font-weight: 500; color: var(--ba-primary); text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Entrar
    </a>
  </div>

  <main style="min-height: calc(100vh - 6rem); display:flex; align-items:center; justify-content:center; padding: 2rem 1.5rem; background-color: var(--ba-background);">
    <div style="text-align:center;max-width:28rem;">
      <div style="margin:0 auto 1.25rem;width:3.5rem;height:3.5rem;border-radius:9999px;background:var(--ba-secondary);display:flex;align-items:center;justify-content:center;color:var(--ba-text);"><svg class="" width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
      <h1 style="font-size:1.75rem;font-weight:800;color:var(--ba-text);margin-bottom:0.75rem;">Página não publicada</h1>
      <p style="font-size:1rem;color:var(--ba-text);opacity:0.7;line-height:1.6;">Esta página não está disponível no momento. Volte em breve.</p>
