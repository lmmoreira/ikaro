name: PR — Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-check:
    name: Architecture validation (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture-check

  dependency-cruise:
    name: Dependency graph validation (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm dep-cruise:test

      - name: Run dependency graph scan (report-only)
        continue-on-error: true
        run: pnpm dep-cruise

  knip:
    name: Unused dependencies + dead exports (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm knip:test

      # Default mode (unused deps + dead exports across every workspace) and
      # --production --strict (restricted to apps/backend, apps/bff, apps/web
      # — the only real deployed services, CLAUDE.md §1) are both real
      # findings: the latter is what actually replicates the #79 anti-pattern
      # (a package imported in production code but declared only under
      # devDependencies), verified empirically during TD37-S13's
      # story-discovery/implementation, 2026-08-22.
      - name: Run knip (report-only)
        continue-on-error: true
        run: |
          # `continue-on-error: true` already keeps the JOB non-blocking —
          # don't also swallow the two commands' own exit codes with `|| true`,
          # or a real tool crash (bad config, missing binary, failed install)
          # reports identically to "found real findings" with no visible
          # signal. `set +e` (not `|| true`) is what's needed here: GitHub
          # Actions' default `bash -eo pipefail` would otherwise abort this
          # script after knip's first non-zero exit, skipping knip:production
          # and the step-summary write entirely.
          set +e
          pnpm knip 2>&1 | tee knip-default-report.txt
          default_status=${PIPESTATUS[0]}
          pnpm knip:production 2>&1 | tee knip-production-report.txt
          production_status=${PIPESTATUS[0]}
          # Report content is knip's own output over this repo's real
          # package.json/source-file names — on a fork PR those names are
          # contributor-controlled. Break any literal triple-backtick run
          # before embedding so it can't close the summary's own code fence
          # early and inject arbitrary rendered Markdown after it. Building
          # the backtick character via printf (not typing it literally)
          # avoids a ShellCheck SC2016 false positive on the sed script.
          backtick=$(printf '\140')
          fence="${backtick}${backtick}${backtick}"
          broken_fence="${backtick}${backtick} ${backtick}"
          break_fences() { sed "s/${fence}/${broken_fence}/g" "$1"; }
          {
            echo '### knip — default mode (unused dependencies + dead exports)'
            echo '```'
            break_fences knip-default-report.txt
            echo '```'
            echo '### knip — production + strict mode (backend/bff/web only)'
            echo '```'
            break_fences knip-production-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$default_status" -ne 0 ] || [ "$production_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload knip reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knip-reports
          path: |
            knip-default-report.txt
            knip-production-report.txt
          retention-days: 7

  no-infra-app-mix:
    name: No infra + app mix
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect infra vs app changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            infra:
              - 'infra/terraform/**'
            app:
              - 'apps/**'
              - 'packages/**'

      # TD30 (2026-07-22): plan/M17-CLOUD-DEPLOY.md's Wave 3 preamble (M17-S24)
      # already documents this as a convention ("do not mix infra/terraform/**
      # and apps/** changes in one PR; when unavoidable, note in the PR that
      # infra applies first and re-run the app deploy if it won the race")
      # — this job is the first automated enforcement of it. Just a path
      # diff, so it reports back in seconds, well before lint/type-check/
      # tests finish — not a true blocking-first gate (that would mean
      # adding needs: to every other job here, a much bigger change for a
      # problem this doesn't require it to solve).
      #
      # The documented convention explicitly allows an "unavoidable" mix if
      # it's noted in the PR — an unconditional fail here would make that
      # exception impossible to actually use (review finding, 2026-07-22).
      # The `infra-app-mix-ok` label is the auditable, deliberate override:
      # a human has to add it explicitly (it won't exist by default), same
      # spirit as any other manual acknowledgment gate in this repo.
      - name: Fail if both infra and app changed (unless explicitly acknowledged)
        if: |
          steps.filter.outputs.infra == 'true' &&
          steps.filter.outputs.app == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'infra-app-mix-ok')
        run: |
          echo "::error::This PR touches both infra/terraform/** and apps/** or packages/** — split them into separate PRs. If truly unavoidable, note in the PR description that infra applies first and re-run the app deploy if it loses the race against the Terraform apply, then add the 'infra-app-mix-ok' label to acknowledge and bypass this check."
          exit 1

  no-foundation-plus-other-infra-mix:
    name: No foundation/** + other infra/terraform/** changes in the same PR
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # need the base commit to diff infra/terraform/** against
          # actions/checkout's default ref for a pull_request event is the synthetic
          # refs/pull/<PR#>/merge — the PR branch merged onto the CURRENT tip of main,
          # not the PR's own actual last commit. For a PR whose branch is stale relative
          # to main, diffing BASE_SHA (the PR's real, historical merge-base) against that
          # synthetic ref picks up every unrelated change that landed on main since —
          # including any foundation/** churn — as if it were part of this PR's own diff.
          # Pinning ref here to the PR's real head SHA makes the diff below reflect only
          # what this PR itself changed. Confirmed live (2026-08-14): a Dependabot PR
          # touching only a .terraform.lock.hcl file (opened 2026-08-11, before this gate
          # existed) false-failed this check once main had accumulated foundation/**
          # commits in the meantime — the identical diff against the PR's real branch tip
          # correctly showed only the lockfile.
          ref: ${{ github.event.pull_request.head.sha }}

      # TD39 (2026-08-13): foundation's workload_catalog local reads
      # infra/terraform/pubsub-catalog.json unconditionally and derives IAM
      # grants for every entry via google_pubsub_topic_iam_member/
      # _subscription_iam_member — resources that do a live IAM-policy read
      # of their target even at plan time. A brand-new topic's (or a new
      # consumer's) target doesn't exist yet until envs/* (a separate
      # Terraform root/state) deploys it. Introducing that target and
      # touching foundation/** in the same PR produced a real, live mutual
      # deadlock (M19-S07/PR #365): foundation's plan 404s on the missing
      # target, and envs/*'s own deploy — the only thing that creates it —
      # is itself gated behind a successful foundation apply. Neither side
      # can go first. The same live-read pattern applies to every other
      # foundation grant list (secrets, Cloud Run invokers, Artifact
      # Registry, buckets) — not just Pub/Sub — so the check is scoped to
      # the whole of infra/terraform/** vs foundation/**, not just the
      # pubsub catalog.
      #
      # Unlike no-infra-app-mix above, there's no legitimate reason to
      # combine these two changes in one PR: the safe path (land the new
      # resource via envs/* first, add the foundation IAM grant in a
      # genuine follow-up PR once it exists live) has no real exception to
      # preserve. Hard-fail, no label escape hatch.
      - name: Detect foundation/** vs other infra/terraform/** changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          foundation=false
          other=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              # Documentation carries zero deploy-ordering risk — only
              # actually-applied Terraform config (or pubsub-catalog.json,
              # which drives it) can ever hit the live-IAM-read deadlock.
              # Excluded so a PR combining a foundation/** fix with its own
              # required README.md doc update (Definition of Done) doesn't
              # trip this guard on itself.
              *.md) ;;
              infra/terraform/foundation/*) foundation=true ;;
              *) other=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD -- infra/terraform)
          echo "foundation=$foundation" >> "$GITHUB_OUTPUT"
          echo "other=$other" >> "$GITHUB_OUTPUT"

      - name: Fail if both foundation/** and other infra/terraform/** changed
        if: steps.filter.outputs.foundation == 'true' && steps.filter.outputs.other == 'true'
        run: |
          echo "::error::This PR touches both infra/terraform/foundation/** and another infra/terraform/** path — split them into separate PRs. This is the TD39 deadlock (M19-S07/PR #365): foundation's IAM-member resources do a live policy read of their target even at plan time, which 404s until envs/* has actually created that target — and envs/* is itself gated behind a successful foundation apply, so neither side can go first when they land together. Land the envs/* change first and merge/deploy it, then add the foundation IAM grant in a genuine follow-up PR once the target exists live. See td/TD39-FOUNDATION-NEW-PUBSUB-TOPIC-DEPLOY-ORDERING.md."
          exit 1

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm prettier --check .

  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

  env-contract:
    name: Terraform env-var contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Cross-checks apps/backend + apps/bff env.validation.ts against the
      # Terraform env/secret maps in infra/terraform/envs/*/main.tf — a var
      # added in code but forgotten in Terraform fails here instead of at
      # deploy time (M17-S18). test includes the real-repo regression guard;
      # env-contract also runs the actual CLI entry point.
      - run: pnpm --filter @ikaro/infra-scripts run test
      - run: pnpm --filter @ikaro/infra-scripts run env-contract

  pubsub-catalog:
    name: Pub/Sub topic/subscription catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Scans apps/backend/src for every GcpPubSubEventBusAdapter
      # subscribe()/registerTrigger() call site and regenerates
      # infra/terraform/pubsub-catalog.json (modules/pubsub's for_each source
      # of truth) — an event or cron trigger registered in code without
      # regenerating the catalog fails here instead of leaving a subscription
      # unprovisioned in Terraform (M17-S19). test covers the scanner's own
      # unit specs; pubsub-catalog regenerates the real file; the diff check
      # proves the committed file matches what the code actually registers.
      - run: pnpm --filter @ikaro/infra-scripts run test
      - run: pnpm --filter @ikaro/infra-scripts run pubsub-catalog
      - run: git diff --exit-code infra/terraform/pubsub-catalog.json

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # reviewdog's github-pr-check reporter posts a Check run via this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          fail_level: error
          reporter: github-pr-check

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # zizmor-action's advanced-security mode uploads SARIF to the Security tab via this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
