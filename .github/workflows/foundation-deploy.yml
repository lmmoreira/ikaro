name: Foundation — Terraform Deploy Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply foundation changes from main through the protected foundation environments.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Do not use a workflow-level paths filter here: required checks must still
  # report on ordinary infrastructure PRs. Route at job level instead, so
  # only Foundation changes can plan with Foundation identities.
  detect_changes:
    name: Detect foundation changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      foundation: ${{ steps.manual.outputs.foundation || steps.filter.outputs.foundation }}
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark manual Foundation dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo 'foundation=true' >> "$GITHUB_OUTPUT"

      - name: Detect Foundation changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            foundation:
              - 'infra/terraform/foundation/**'
              - '.github/workflows/foundation-deploy.yml'

      - name: List Foundation modules with tests
        id: modules
        run: |
          modules=$(for d in infra/terraform/foundation/modules/*/; do
            name=$(basename "$d")
            if [ -d "${d}tests" ]; then echo "$name"; fi
          done | jq -R -s -c 'split("\n")[:-1]')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  validate:
    name: Terraform validate (${{ matrix.environment }})
    needs: detect_changes
    if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      - name: terraform validate — ${{ matrix.environment }}
        working-directory: infra/terraform/foundation/envs/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  test:
    name: Terraform test (foundation ${{ matrix.module }})
    needs: detect_changes
    if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect_changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      - name: terraform init — foundation ${{ matrix.module }}
        working-directory: infra/terraform/foundation/modules/${{ matrix.module }}
        run: terraform init -input=false -lockfile=readonly

      - name: terraform test — foundation ${{ matrix.module }}
        working-directory: infra/terraform/foundation/modules/${{ matrix.module }}
        run: terraform test

  plan_staging:
    name: Terraform plan — foundation (staging)
    needs: [detect_changes, validate, test]
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.detect_changes.outputs.foundation == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_STAGING }}
          service_account: ikaro-tf-foundation-planner@ikaro-staging.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Mask IAM admin email
        run: echo "::add-mask::${{ vars.IAM_ADMIN_USER }}"
      - name: terraform plan — foundation staging
        working-directory: infra/terraform/foundation/envs/staging
        env:
          TF_VAR_iam_admin_user: ${{ vars.IAM_ADMIN_USER }}
        run: |
          terraform init -input=false -lockfile=readonly
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan >/dev/null
          terraform show -json tfplan | jq -r '.resource_changes[] | "\(.address): \(.change.actions | join(","))"' > plan-summary.txt
          { echo '### Foundation plan — staging'; echo '```'; cat plan-summary.txt; echo '```'; echo 'Resource addresses and actions only; no attribute values or plan artifact are retained.'; } >> "$GITHUB_STEP_SUMMARY"
          rm -f tfplan plan-summary.txt

  plan_prod:
    name: Terraform plan — foundation (prod)
    needs: [detect_changes, validate, test]
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.detect_changes.outputs.foundation == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ikaro-tf-foundation-planner@ikaro-prod.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Mask IAM admin email
        run: echo "::add-mask::${{ vars.IAM_ADMIN_USER }}"
      - name: terraform plan — foundation prod
        working-directory: infra/terraform/foundation/envs/prod
        env:
          TF_VAR_iam_admin_user: ${{ vars.IAM_ADMIN_USER }}
        run: |
          terraform init -input=false -lockfile=readonly
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan >/dev/null
          terraform show -json tfplan | jq -r '.resource_changes[] | "\(.address): \(.change.actions | join(","))"' > plan-summary.txt
          { echo '### Foundation plan — production'; echo '```'; cat plan-summary.txt; echo '```'; echo 'Resource addresses and actions only; no attribute values or plan artifact are retained.'; } >> "$GITHUB_STEP_SUMMARY"
          rm -f tfplan plan-summary.txt

  apply_staging:
    name: Apply foundation (staging)
    needs: plan_staging
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-foundation
    concurrency:
      group: staging-mutations
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_STAGING }}
          service_account: ${{ secrets.TF_FOUNDATION_SA_STAGING }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Mask IAM admin email
        run: echo "::add-mask::${{ vars.IAM_ADMIN_USER }}"
      - name: terraform apply — foundation staging
        working-directory: infra/terraform/foundation/envs/staging
        env:
          TF_VAR_iam_admin_user: ${{ vars.IAM_ADMIN_USER }}
        run: |
          terraform init -input=false -lockfile=readonly
          terraform plan -input=false -lock-timeout=60s -out=tfplan
          terraform apply -input=false tfplan
          rm -f tfplan

  apply_prod:
    name: Apply foundation (prod)
    needs: [plan_prod, apply_staging]
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-foundation
    concurrency:
      group: production-mutations
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.TF_FOUNDATION_SA_PROD }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Mask IAM admin email
        run: echo "::add-mask::${{ vars.IAM_ADMIN_USER }}"
      - name: terraform apply — foundation prod
        working-directory: infra/terraform/foundation/envs/prod
        env:
          TF_VAR_iam_admin_user: ${{ vars.IAM_ADMIN_USER }}
        run: |
          terraform init -input=false -lockfile=readonly
          terraform plan -input=false -lock-timeout=60s -out=tfplan
          terraform apply -input=false tfplan
          rm -f tfplan
