# otel-collector config — the ONLY place GCP-specific exporter code appears
# (M17 D9 anti-lock-in guardrail). Swapping vendors = edit the exporter block
# below + the traces pipeline's `exporters:` list, rebuild via
# .github/workflows/build-otel-collector.yml, done. No app change, no
# Terraform change — see README.md for the full rebuild/deploy path.
#
# Validated against the real otel/opentelemetry-collector-contrib:0.157.0
# binary (M17-S34 implementation, 2026-08-04) — `resourcedetection` is a
# deprecated processor alias as of this version; `resource_detection` is the
# canonical name (confirmed via the collector's own startup deprecation
# warning, not assumed from memory).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource_detection:
    detectors: [gcp]
    timeout: 2s
  # No `batch` processor (removed 2026-08-05, M17-S34 follow-up — real staging
  # finding): its flush trigger was a wall-clock timer (explicitly configured
  # `timeout: 5s` here, not merely the framework default), and this
  # collector runs as a sidecar in the SAME CPU-throttled Cloud Run instance as
  # the app (`run.googleapis.com/cpu-throttling: "true"`). The app side already
  # fixed an identical timer-starvation bug by switching to SimpleSpanProcessor
  # (one export call per span, no batching) — keeping a `batch` processor here
  # just moved that exact bug one hop downstream, into a second container's
  # timer instead of removing it. Measured impact: ~73% of traces silently
  # never reached Cloud Trace with `batch` in place (33-trace staging sample,
  # 2026-08-05). Since the app no longer sends real batches (one span per
  # OTLP call), this processor had zero grouping benefit left anyway — pure
  # timer-dependency risk with no upside in this deployment.

exporters:
  # No `project:` field — the googlecloud exporter auto-detects the current
  # project via Application Default Credentials (Cloud Run's metadata
  # server). This one image is deployed unmodified to both staging and prod
  # (D8, single Artifact Registry) — a hardcoded project here would silently
  # break whichever environment it wasn't meant for.
  googlecloud:
    # sending_queue disabled (2026-08-05, M17-S34 follow-up, same finding as
    # the `batch` processor above): the default queue is an async worker pool
    # requiring background CPU independent of any incoming request — exactly
    # what Cloud Run's CPU throttling can starve. Disabling it forces every
    # export to complete (or fail) synchronously inside the OTLP receive call,
    # so it always runs while CPU is guaranteed allocated (an active request
    # is in flight). Empirically verified (2026-08-05): with the queue
    # enabled, a span POST to the receiver returns HTTP 200 in ~2ms — an ACK
    # before any real Cloud Trace call happens; with it disabled, the same
    # call took ~296ms and the real downstream result (an auth error, in that
    # test) came back synchronously in the response, proving the export
    # genuinely completes in-request. `retry_on_failure` is NOT set here — this
    # exporter version rejects it as an invalid key (confirmed via
    # `validate` against the real pinned binary); resilience against
    # transient failures relies on the underlying Google Cloud Go SDK's own
    # built-in retry, which is always-on and not collector-configurable.
    # No effect on user-facing request latency: the app's SimpleSpanProcessor
    # only triggers export from the HTTP response's `close` event (see
    # @opentelemetry/instrumentation-http's `_onServerResponseFinish`), which
    # fires strictly after the response has already been sent to the client.
    #
    # `timeout: 5s` (added 2026-08-05, cross-tool review finding on PR #324):
    # without an explicit bound, a synchronous export blocks for however long
    # the underlying Google Cloud Go SDK's own internal retry/backoff takes to
    # give up during a real Cloud Trace outage — undocumented here and
    # potentially much longer than the ~330-1165ms this took in normal
    # operation (measured, PR #324). Concurrent spans during an outage would
    # each hold a blocked connection on the sidecar's small 0.1 vCPU
    # allocation for that whole window. An explicit timeout caps the worst
    # case per export without reintroducing the async queue this fix removes.
    timeout: 5s
    sending_queue:
      enabled: false

  # Alternate exporter (swap target vendor): uncomment, point at the new
  # backend, add it to the traces pipeline's exporters list below, remove
  # `googlecloud` from that list (or keep both to dual-ship during a
  # migration). Rebuild via the dedicated workflow — the next backend/BFF
  # deploy picks it up automatically. No app change.
  # otlp/vendor:
  #   endpoint: tempo.example.com:4317
  #   tls:
  #     insecure: false

extensions:
  # NOT wired to a Cloud Run startup_probe / container dependency (removed
  # 2026-08-04, cross-tool PR review finding on PR #318): gating the app
  # container's own startup on this endpoint would mean a crashed/unhealthy
  # collector blocks the app from starting at all — see
  # modules/cloudrun-service/variables.tf for the full rationale. Kept for
  # manual/external diagnostics only (e.g. an operator curling it directly).
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection]
      exporters: [googlecloud]
  # Metrics pipeline stub — deferred to a future story (googlemanagedprometheus
  # exporter), see M17-S34 description.
