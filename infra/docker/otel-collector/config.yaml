# otel-collector config — the ONLY place GCP-specific exporter code appears
# (M17 D9 anti-lock-in guardrail). Swapping vendors = edit the exporter block
# below + the traces pipeline's `exporters:` list, rebuild via
# .github/workflows/build-otel-collector.yml, done. No app change, no
# Terraform change — see README.md for the full rebuild/deploy path.
#
# Validated against the real otel/opentelemetry-collector-contrib:0.157.0
# binary (M17-S34 implementation, 2026-08-04) — `resourcedetection` is a
# deprecated processor alias as of this version; `resource_detection` is the
# canonical name (confirmed via the collector's own startup deprecation
# warning, not assumed from memory).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource_detection:
    detectors: [gcp]
    timeout: 2s
  # `batch` processor REINTRODUCED (2026-08-06, M17-S34 follow-up — real
  # staging finding, reversing the 2026-08-05 removal below). Kept for the
  # record: this processor (and the exporter's `sending_queue`) was removed
  # on 2026-08-05 because a wall-clock-timer-driven flush can be silently
  # starved by Cloud Run's `run.googleapis.com/cpu-throttling: "true"`, and a
  # 33-trace staging sample measured ~73% loss with it in place. That
  # measurement was taken while the app-side `ParentBasedSampler` bug (fixed
  # the same day, see docs/ENGINEERING_RULES.md § Cloud Run CPU throttling)
  # was still silently dropping most spans before export was ever attempted —
  # meaning real span arrival at the collector was extremely sparse, with
  # long idle/throttled gaps between spans, which is exactly the condition
  # under which a timer-based flush is most likely to land in a throttled
  # gap. The measurement was real, but the traffic pattern it was measured
  # under doesn't reflect steady real traffic.
  #
  # Once the sampler bug and the exporter's own `concurrencyLimit` were both
  # fixed (PR #325, PR #326), a NEW, unrelated problem appeared: Cloud
  # Trace's write API has a documented, per-project quota of 4,800 requests
  # per 60 seconds (80 req/s) — https://docs.cloud.google.com/trace/docs/quotas.
  # With one synchronous export call per span (no batching) and real traffic
  # flowing, a single burst of ordinary dashboard traffic (~4 HTTP requests,
  # each fanning out to 15-20+ spans) produced 71 simultaneous export calls
  # within ~300ms — an instantaneous rate of ~237 req/s, nearly 3x the quota
  # — causing Cloud Trace to throttle and the exporter's `timeout: 2s` to
  # trip, permanently losing all 71 spans (no retry — see the exporter's own
  # `sending_queue` comment below). This is a hard external ceiling, not a
  # resource-contention problem — more CPU/memory would not have fixed it.
  #
  # Re-tested batching live on staging with real traffic (2026-08-06): a
  # small `send_batch_size` and short `timeout` (well under the old 5s)
  # coalesce many small export calls into far fewer, larger ones, keeping
  # comfortably under the write-quota ceiling without depending on the timer
  # ever firing during genuinely idle/throttled time — real traffic keeps the
  # batch's size threshold hit long before its timeout would matter. Verified
  # over ~34 minutes across two real-traffic bursts: one dropped batch (32
  # spans) ~2 minutes after a fresh deploy — consistent with one-time
  # connection/auth warm-up, not a steady-state pattern — then zero failures
  # and 37/37 traces fully intact on a second burst ~20 minutes later, once
  # warm. Compare to the committed-at-the-time no-batch design, which lost
  # spans on two separate occasions under the same kind of ordinary traffic
  # (71 in one burst, 4 more shortly after) with no warm-up excuse either
  # time. Not proven zero-loss forever — still worth monitoring — but a
  # clear, repeatable improvement over unbounded one-call-per-span.
  batch:
    timeout: 1s
    send_batch_size: 50

exporters:
  # No `project:` field — the googlecloud exporter auto-detects the current
  # project via Application Default Credentials (Cloud Run's metadata
  # server). This one image is deployed unmodified to both staging and prod
  # (D8, single Artifact Registry) — a hardcoded project here would silently
  # break whichever environment it wasn't meant for.
  googlecloud:
    # timeout: 2s (added 2026-08-05, cross-tool review finding on PR #324):
    # bounds a single export call so it fails fast rather than hanging for
    # however long the underlying Google Cloud Go SDK's own internal
    # retry/backoff takes during a real Cloud Trace outage — see the `batch`
    # processor comment above for the full history. Unchanged by the
    # 2026-08-06 batch/queue reintroduction below: still the right bound for
    # a single batched export call, same as it was for a single span.
    timeout: 2s
    # sending_queue REINTRODUCED (2026-08-06, M17-S34 follow-up, same finding
    # as the `batch` processor above — read that comment first for the full
    # history of why this was disabled on 2026-08-05 and why that measurement
    # doesn't hold under today's real, sampler-fixed traffic). `enabled: true`
    # here works together with `batch` above: the processor groups spans into
    # a batch, the queue is what lets a batch's own export call happen
    # without blocking the OTLP receive call that triggered it — necessary
    # once exports are no longer one-per-span, since a request's own spans
    # need to keep flowing into the next batch rather than queueing up behind
    # a single in-flight synchronous export.
    #
    # IMPORTANT — this is NOT resilience against failure, despite the name.
    # `retry_on_failure` is NOT set here — this exporter version rejects it
    # as an invalid key (confirmed via `validate` against the real pinned
    # binary: `'googlecloudexporter.Config' has invalid keys: retry_on_failure`,
    # re-verified 2026-08-06). When an export genuinely fails or times out,
    # the queue sender logs `"Exporting failed. Dropping data."` with a
    # `dropped_items` count and the batch is gone — permanently, no retry,
    # no requeue. Confirmed live in the same 2026-08-06 test that justified
    # reintroducing this: one such drop (32 items) happened ~2 minutes after
    # a fresh deploy, most likely a one-time connection/auth warm-up cost,
    # not a steady-state pattern — but the mechanism itself is real and
    # unmitigated. If failures recur under steady traffic (not just after a
    # fresh deploy), the fix is a smaller `send_batch_size` (less lost per
    # failure) or investigating a genuine backpressure/retry mechanism, not
    # assuming this is safe by default.
    sending_queue:
      enabled: true

  # Alternate exporter (swap target vendor): uncomment, point at the new
  # backend, add it to the traces pipeline's exporters list below, remove
  # `googlecloud` from that list (or keep both to dual-ship during a
  # migration). Rebuild via the dedicated workflow — the next backend/BFF
  # deploy picks it up automatically. No app change.
  # otlp/vendor:
  #   endpoint: tempo.example.com:4317
  #   tls:
  #     insecure: false

extensions:
  # NOT wired to a Cloud Run startup_probe / container dependency (removed
  # 2026-08-04, cross-tool PR review finding on PR #318): gating the app
  # container's own startup on this endpoint would mean a crashed/unhealthy
  # collector blocks the app from starting at all — see
  # modules/cloudrun-service/variables.tf for the full rationale. Kept for
  # manual/external diagnostics only (e.g. an operator curling it directly).
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [googlecloud]
  # Metrics pipeline stub — deferred to a future story (googlemanagedprometheus
  # exporter), see M17-S34 description.
